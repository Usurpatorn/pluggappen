<script>
/* ========= Algebra engine: multivariate polynomials, parser, formatting ========= */
const Poly = (() => {
  // monomial key: "" for constant, "x" , "x^2", "x*y" (vars sorted)
  const monoFromVars = (vars) => {
    const names = Object.keys(vars).filter(v => vars[v] !== 0).sort();
    return names.map(v => vars[v] === 1 ? v : v + '^' + vars[v]).join('*');
  };
  const varsFromMono = (key) => {
    const o = {};
    if (!key) return o;
    key.split('*').forEach(p => { const [v, e] = p.split('^'); o[v] = e ? +e : 1; });
    return o;
  };
  const clean = (p) => { for (const k in p) if (Math.abs(p[k]) < 1e-9) delete p[k]; return p; };
  const num = (n) => clean({ '': n });
  const variable = (v) => ({ [v]: 1 });
  const add = (a, b) => { const r = { ...a }; for (const k in b) r[k] = (r[k] || 0) + b[k]; return clean(r); };
  const neg = (a) => { const r = {}; for (const k in a) r[k] = -a[k]; return r; };
  const sub = (a, b) => add(a, neg(b));
  const mul = (a, b) => {
    const r = {};
    for (const ka in a) for (const kb in b) {
      const va = varsFromMono(ka), vb = varsFromMono(kb);
      for (const v in vb) va[v] = (va[v] || 0) + vb[v];
      const k = monoFromVars(va);
      r[k] = (r[k] || 0) + a[ka] * b[kb];

    const keys = new Set([...Object.keys(a), ...Object.keys(b)]);

    let out = '';
    keys.forEach((k, i) => {
      const c = a[k];
      const abs = Math.abs(c);
      const sign = c < 0 ? '−' : '+';
      let body = k === '' ? fmtNum(abs) : ((abs === 1 ? '' : fmtNum(abs)) + monoStr(k));
      if (i === 0) out += (c < 0 ? '−' : '') + body;
      else out += ' ' + sign + ' ' + body;
    });
    return out;
  };
  // Plain-ASCII canonical form for comparisons/tests: 3x^2-2x+5
  const ascii = (a) => format(a).replace(/−/g, '-').replace(/ /g, '').replace(/²/g, '^2').replace(/³/g, '^3');

  /* ---------- Parser ---------- */
  const tokenize = (s) => {
    s = s.replace(/−|–|—/g, '-').replace(/·|×|\*\*/g, '*').replace(/:/g, '/').replace(/,/g, '.').replace(/\s+/g, '');
    s = s.replace(/²/g, '^2').replace(/³/g, '^3');
    const toks = []; let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/[0-9.]/.test(ch)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; toks.push({ t: 'num', v: parseFloat(s.slice(i, j)) }); i = j; continue; }
      if (/[a-zA-ZåäöÅÄÖ]/.test(ch)) { toks.push({ t: 'var', v: ch }); i++; continue; }
      if ('+-*/^()'.includes(ch)) { toks.push({ t: ch }); i++; continue; }
      throw new Error('tecken');
    }
    return toks;
  };
  const parse = (s) => {
    const toks = tokenize(s); let p = 0;
    const peek = () => toks[p]; const next = () => toks[p++];
    const startsAtom = (t) => t && (t.t === 'num' || t.t === 'var' || t.t === '(');
    function expr() {
      let v = term();
      while (peek() && (peek().t === '+' || peek().t === '-')) { const op = next().t; const r = term(); v = op === '+' ? add(v, r) : sub(v, r); }
      return v;
    }
    function term() {
      let v = factor();
      for (;;) {
        const t = peek();
        if (t && (t.t === '*' || t.t === '/')) { next(); const r = factor(); v = t.t === '*' ? mul(v, r) : div(v, r); }
        else if (startsAtom(t)) { const r = factor(); v = mul(v, r); } // implicit multiplication
        else break;
      }
      return v;
    }
    function factor() {
      const t = peek();
      if (t && t.t === '-') { next(); return neg(factor()); }
      if (t && t.t === '+') { next(); return factor(); }
      return power();
    }
    function power() {
      let base = atom();
      if (peek() && peek().t === '^') { next(); const e = atom(); if (!isConst(e)) throw new Error('exp'); base = pow(base, constVal(e)); }
      return base;
    }
    function atom() {
      const t = next();
      if (!t) throw new Error('slut');
      if (t.t === 'num') return num(t.v);
      if (t.t === 'var') return variable(t.v);
      if (t.t === '(') { const v = expr(); const c = next(); if (!c || c.t !== ')') throw new Error('paren'); return v; }
      throw new Error('tecken');
    }
    const v = expr();
    if (p !== toks.length) throw new Error('rest');
    return v;
  };
  const tryParse = (s) => { try { if (!s || !s.trim()) return null; return parse(s); } catch (e) { return null; } };
  // Is the student's answer written in simplest form? (no repeated monomials, no parentheses, no '*')
  const isSimplified = (s, target) => {
    const t = s.replace(/−|–/g, '-').replace(/\s+/g, '');
    if (/[()*/^]/.test(t.replace(/\^2|\^3|²|³/g, ''))) return false;
    // count terms
    const terms = t.replace(/^-/, '').split(/[+-]/).filter(Boolean);
    const targetTerms = Object.keys(target).filter(k => Math.abs(target[k]) > 1e-9).length;
    return terms.length === targetTerms;
  };
  return { num, variable, add, sub, mul, neg, pow, div, equal, format, ascii, parse, tryParse, isSimplified, evalAt, fmtNum, isConst, constVal };
})();

/* ========= Random helpers ========= */
const R = {
  int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  shuffle: (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  nonzero: (a, b) => { let v = 0; while (v === 0) v = R.int(a, b); return v; },
  sign: () => (Math.random() < 0.5 ? -1 : 1),
  chance: (p) => Math.random() < p,
};

// helpers for writing readable algebra in question texts
const T = {
  // "3x", "x", "−2x"
  term: (c, v) => { if (c === 0) return '0'; const a = Math.abs(c); return (c < 0 ? '−' : '') + (a === 1 ? '' : Poly.fmtNum(a)) + v; },
  // signed term for continuing an expression: " + 3x" / " − 3x"
  signed: (c, v = '') => { if (c === 0) return ''; const a = Math.abs(c); const body = v ? ((a === 1 ? '' : Poly.fmtNum(a)) + v) : Poly.fmtNum(a); return (c < 0 ? ' − ' : ' + ') + body; },
  // linear "ax + b" with proper signs
  lin: (a, b, v = 'x') => { if (a === 0) return Poly.fmtNum(b); let s = T.term(a, v); if (b !== 0) s += T.signed(b); return s; },
  n: (n) => (n < 0 ? '−' + Poly.fmtNum(-n) : Poly.fmtNum(n)),
  paren: (n) => (n < 0 ? '(−' + Poly.fmtNum(-n) + ')' : Poly.fmtNum(n)),
  // Make numeric choices around correct answer
  choices: (correct, count = 4, spread = 3) => {
    const set = new Set([correct]);
    let guard = 0;
    while (set.size < count && guard++ < 100) {
      let d = R.nonzero(-spread, spread);
      if (Math.abs(correct) > 20 && R.chance(0.5)) d *= 10;
      const v = correct + d;
      if (v >= 0 || correct < 0) set.add(v);
    }
    return R.shuffle([...set]);
  },
};

// A1: multiplicera in tal i parenteser
function genMultIn(level) {
  const v = 'x';
  let a, b, c, text, steps, answer, hint;
  if (level === 1) {
    a = R.int(2, 6); b = R.int(1, 6); c = R.int(1, 9);
    const plus = R.chance(0.7);
    const cc = plus ? c : -c;
    text = `Multiplicera in: ${m(`${a}(${T.lin(b, cc)})`)}`;
    answer = Poly.parse(`${a}*(${b}x+(${cc}))`);
    steps = [
      `Talet ${m(a)} utanför parentesen ska multipliceras med <b>varje</b> term inuti.`,
      `${m(`${a} · ${T.term(b, v)} = ${T.term(a * b, v)}`)}`,
      `${m(`${a} · ${T.paren(cc)} = ${T.n(a * cc)}`)}`,
      `Svar: ${m(Poly.format(answer))}`,
    ];
    hint = `Pilarna: ${a} gånger första termen, sedan ${a} gånger andra termen.`;
  } else if (level === 2) {
    a = R.int(2, 9) * R.sign(); b = R.int(1, 8); c = R.nonzero(-12, 12);
    text = `Multiplicera in: ${m(`${T.n(a)}(${T.lin(b, c)})`)}`;
    answer = Poly.parse(`(${a})*(${b}x+(${c}))`);
    steps = [
      `Multiplicera ${m(T.n(a))} med varje term i parentesen. Håll koll på tecknen!`,
      `${m(`${T.paren(a)} · ${T.term(b, v)} = ${T.term(a * b, v)}`)}`,
      `${m(`${T.paren(a)} · ${T.paren(c)} = ${T.n(a * c)}`)}  ${a < 0 && c < 0 ? '(minus gånger minus blir plus)' : a < 0 || c < 0 ? '(minus gånger plus blir minus)' : ''}`,
      `Svar: ${m(Poly.format(answer))}`,
    ];
    hint = a < 0 ? 'Ett negativt tal utanför byter tecken på alla termer inuti.' : 'Multiplicera med båda termerna, även den med minus.';
  } else {
    // variable outside or three terms or parenthesis last
    const variant = R.int(1, 4);
    if (variant === 4) {
      const [u, w] = R.pick([['a', 'b'], ['x', 'y'], ['p', 'q']]); a = R.int(2, 5); b = R.int(2, 6); c = R.nonzero(-7, 7);
      text = `Multiplicera in: ${m(`${a}${u}(${T.term(b, w)}${T.signed(c)})`)}`;
      answer = Poly.parse(`${a}${u}*(${b}${w}+(${c}))`);
      steps = [
        `${m(a + u)} står utanför och ska multipliceras med båda termerna.`,
        `${m(`${a}${u} · ${T.term(b, w)} = ${T.term(a * b, u + w)}`)} (talen multipliceras, bokstäverna skrivs ihop)`,
        `${m(`${a}${u} · ${T.paren(c)} = ${T.term(a * c, u)}`)}`,
        `Svar: ${m(Poly.format(answer))}`,
      ];
      hint = `Tal gånger tal, och ${u} · ${w} skrivs ${u}${w}.`;
      return { type: 'expr', variable: u, variables: [u, w], text, answer, steps, hint, level };
    }
    if (variant === 1) {
      b = R.int(2, 7); c = R.nonzero(-9, 9);
      text = `Multiplicera in: ${m(`x(${T.lin(b, c)})`)}`;
      answer = Poly.parse(`x*(${b}x+(${c}))`);
      steps = [
        `Här är det ${m('x')} som står utanför. ${m('x · x = x²')}.`,
        `${m(`x · ${T.term(b, v)} = ${T.term(b, 'x²')}`)}`,
        `${m(`x · ${T.paren(c)} = ${T.term(c, v)}`)}`,
        `Svar: ${m(Poly.format(answer))}`,
      ];
      hint = 'x gånger x blir x². x gånger ett tal blir ett x-uttryck.';
    } else if (variant === 2) {
      a = R.int(2, 6) * R.sign(); b = R.nonzero(-5, 5); c = R.nonzero(-7, 7); const d = R.nonzero(-9, 9);
      const inner = `${T.term(b, 'x²')}${T.signed(c, 'x')}${T.signed(d)}`;
      text = `Multiplicera in: ${m(`${T.n(a)}(${inner})`)}`;
      answer = Poly.parse(`(${a})*(${b}x^2+(${c})x+(${d}))`);
      steps = [
        `Tre termer i parentesen – ${m(T.n(a))} ska multipliceras med alla tre.`,
        `${m(`${T.paren(a)} · ${T.term(b, 'x²')} = ${T.term(a * b, 'x²')}`)}`,
        `${m(`${T.paren(a)} · ${T.term(c, v)} = ${T.term(a * c, v)}`)}`,
        `${m(`${T.paren(a)} · ${T.paren(d)} = ${T.n(a * d)}`)}`,
        `Svar: ${m(Poly.format(answer))}`,
      ];
      hint = 'Gör en term i taget. Tre termer inuti ger tre termer i svaret.';
    } else {
      a = R.int(2, 9); b = R.int(2, 9); c = R.nonzero(-10, 10);
      text = `Multiplicera in: ${m(`(${T.lin(b, c)}) · ${a}`)}`;
      answer = Poly.parse(`(${b}x+(${c}))*${a}`);
      steps = [
        `Talet står efter parentesen, men det spelar ingen roll – multiplicera ändå med varje term.`,
        `${m(`${T.term(b, v)} · ${a} = ${T.term(a * b, v)}`)}`,
        `${m(`${T.paren(c)} · ${a} = ${T.n(a * c)}`)}`,
        `Svar: ${m(Poly.format(answer))}`,
      ];
      hint = 'Ordningen spelar ingen roll vid multiplikation.';
    }
  }
  return { type: 'expr', variable: v, text, answer, steps, hint, level };
}

// A2: förenkla uttryck med parenteser
function genForenkla(level) {
  const v = 'x'; let text, steps, answer, hint;
  if (level === 1) {
    // a(bx+c) + dx + e   or  px + q + a(bx+c)
    const a = R.int(2, 5), b = R.int(1, 5), c = R.int(1, 8), d = R.int(1, 6), e = R.nonzero(-9, 9);
    text = `Förenkla: ${m(`${a}(${T.lin(b, c)})${T.signed(d, 'x')}${T.signed(e)}`)}`;
    answer = Poly.parse(`${a}*(${b}x+${c})+${d}x+(${e})`);
    steps = [
      `Multiplicera först in ${m(a)} i parentesen: ${m(`${a}(${T.lin(b, c)}) = ${T.lin(a * b, a * c)}`)}`,
      `Nu har vi: ${m(`${T.lin(a * b, a * c)}${T.signed(d, 'x')}${T.signed(e)}`)}`,
      `Samla x-termerna: ${m(`${T.term(a * b, v)}${T.signed(d, 'x')} = ${T.term(a * b + d, v)}`)}`,
      `Samla talen: ${m(`${a * c}${T.signed(e)} = ${T.n(a * c + e)}`)}`,

  } else if (level === 2) {

    if (variant === 1) {

      text = `Förenkla: ${m(`${T.lin(p, q)} − (${T.lin(r, s)})`)}`;

      steps = [
        `Ett minustecken framför en parentes byter tecken på <b>allt</b> inuti när parentesen tas bort.`,

        `Svar: ${m(Poly.format(answer))}`,

    } else {

      text = `Förenkla: ${m(`${a}(${T.lin(b, c)}) + ${d}(${T.lin(e, f)})`)}`;
      answer = Poly.parse(`${a}*(${b}x+(${c}))+${d}*(${e}x+(${f}))`);
      steps = [
        `Multiplicera in i första parentesen: ${m(`${a}(${T.lin(b, c)}) = ${T.lin(a * b, a * c)}`)}`,
        `Multiplicera in i andra parentesen: ${m(`${d}(${T.lin(e, f)}) = ${T.lin(d * e, d * f)}`)}`,
        `Lägg ihop: ${m(`${T.lin(a * b, a * c)}${T.signed(d * e, 'x')}${T.signed(d * f)}`)}`,
        `x-termer: ${m(T.term(a * b + d * e, v))}. Tal: ${m(T.n(a * c + d * f))}`,

  } else if (level === 2 && R.chance(0.35)) {

// A3: blandade uppgifter med algebraiska uttryck
function genBlandat(level) {

  const variant = level === 1 ? R.pick(['varde', 'liketerms', 'ord']) : level === 2 ? R.pick(['varde2', 'ord2', 'omkrets', 'liketerms2']) : R.pick(['varde3', 'area', 'ord3', 'ekv']);

  switch (variant) {

        steps: [`Byt ut ${m('x')} mot ${m(x)}: ${m(`${a} · ${x}${T.signed(b)}`)}`, `${m(`${a} · ${x} = ${a * x}`)}`, `${m(`${a * x}${T.signed(b)} = ${ans}`)}`],

        steps: [`Byt ut ${m('x')} mot ${m(x)}: ${m(`${a}(${x}${T.signed(b)})${T.signed(c)}`)}`, `Räkna parentesen först: ${m(`${x}${T.signed(b)} = ${x + b}`)}`, `${m(`${a} · ${T.paren(x + b)} = ${a * (x + b)}`)}`, `${m(`${a * (x + b)}${T.signed(c)} = ${ans}`)}`],

// A4: talföljder – uttryck och formel
function genTalfoljd(level) {
  const v = 'n';
  const d = level === 1 ? R.int(2, 5) : level === 2 ? R.int(2, 9) : R.pick([2, 3, 4, 5, 6, 7, 8, 9, -2, -3, -5]);
  const first = level === 3 ? R.int(1, 40) : R.int(1, 12);
  const b = first - d; // formula d·n + b
  const terms = [1, 2, 3, 4].map(n => d * n + b);
  const seq = terms.map(T.n).join(', ') + ', …';
  const variant = level === 1 ? R.pick(['next', 'next', 'nth10']) : level === 2 ? R.pick(['formula', 'nth', 'formula']) : R.pick(['formula', 'figur', 'given']);
  const formulaStr = T.lin(d, b, v);
  const steps = [
    `<b>Differens:</b> ${m(`${T.n(terms[1])} − ${T.paren(terms[0])} = ${T.n(d)}`)}`,
    `<b>Variabelterm:</b> differensen gånger n → ${m(T.term(d, 'n'))}`,
    `<b>Sifferterm:</b> n = 1 ger ${m(`${T.n(d)} · 1 = ${T.n(d)}`)}, men första talet är ${m(T.n(first))}. ${m(`${T.n(first)} − ${T.paren(d)} = ${T.n(b)}`)}`,
    `<b>Uttryck:</b> ${m(formulaStr)}`,
    `Kontroll med n = 2: ${m(`${T.n(d)} · 2${T.signed(b)} = ${T.n(terms[1])}`)} ✓`,
  ];
  if (variant === 'next') {
    return { type: 'num', text: `Vilket tal kommer härnäst i talföljden ${m(seq)}?`, answer: d * 5 + b, level, hint: `Hur mycket ökar talen varje steg?`,
      steps: [`Talen ökar med ${m(T.n(d))} varje gång.`, `${m(`${T.n(terms[3])}${T.signed(d)} = ${T.n(d * 5 + b)}`)}`], choices: T.choices(d * 5 + b, 4, d) };
  }
  if (variant === 'nth10') {
    return { type: 'num', text: `Talföljd: ${m(seq)}. Vilket är tal nummer 10?`, answer: d * 10 + b, level, hint: 'Hitta formeln först, sätt sedan in n = 10.',
      steps: [...steps, `Tal nummer 10: ${m(`${T.n(d)} · 10${T.signed(b)} = ${T.n(d * 10 + b)}`)}`] };
  }
  if (variant === 'nth') {
    const k = R.pick([12, 15, 20, 25, 50, 100]);
    return { type: 'num', text: `Talföljd: ${m(seq)}. Vilket är tal nummer ${k}?`, answer: d * k + b, level, hint: `Hitta formeln för tal nummer n, sätt in n = ${k}.`,
      steps: [...steps, `Tal nummer ${k}: ${m(`${T.n(d)} · ${k}${T.signed(b)} = ${T.n(d * k + b)}`)}`] };
  }
  if (variant === 'figur') {
    const base = R.int(1, 4), per = R.int(2, 5);
    const answer = Poly.parse(`${per}n+${base}`);
    return { type: 'expr', variable: v, text: `Ett mönster byggs av stickor. Figur 1 har ${per + base} stickor, figur 2 har ${2 * per + base} och figur 3 har ${3 * per + base}. Skriv ett uttryck för antalet stickor i figur ${m('n')}.`, answer, level,
      hint: 'Differens = hur många stickor läggs till per figur? Sifferterm = vad fattas för figur 1?',
      steps: [`<b>Differens:</b> ${m(`${2 * per + base} − ${per + base} = ${per}`)} stickor per figur.`, `<b>Variabelterm:</b> ${m(`${per}n`)}`, `<b>Sifferterm:</b> figur 1 har ${per + base}, och ${m(`${per} · 1 = ${per}`)}, så ${m(base)} till.`, `<b>Uttryck:</b> ${m(`${per}n + ${base}`)}`] };
  }
  if (variant === 'given') {
    const k = R.int(5, 12);
    const text = `Tal nummer ${m('n')} i en talföljd ges av formeln ${m(formulaStr)}. Beräkna tal nummer ${k}.`;
    return { type: 'num', text, answer: d * k + b, level, hint: `Byt ut n mot ${k}.`, steps: [`Sätt in ${m(`n = ${k}`)}: ${m(`${T.n(d)} · ${k}${T.signed(b)}`)}`, `${m(`= ${T.n(d * k)}${T.signed(b)} = ${T.n(d * k + b)}`)}`] };
  }
  // formula
  const answer = Poly.parse(`${d}n+(${b})`);
  return { type: 'expr', variable: v, text: `Talföljd: ${m(seq)}. Skriv ett uttryck för tal nummer ${m('n')}.`, answer, level, hint: 'Skillnaden mellan talen blir talet framför n. Justera sedan så att n = 1 ger första talet.', steps };
}


// A5: ekvationer (§2.5–2.6) – svaret kontrolleras med VL = HL som i boken
function genEkvation(level) {
  const v = R.pick(level === 1 ? ['x'] : ['x', 'a', 'z', 'b']);
  const vlhl = (lhs, rhs, x) => `Kontroll: V.L. = ${m(lhs)} = ${m(rhs)} = H.L. ✓ (${v} = ${x})`;
  if (level === 1) {
    const a = R.int(2, 9), x = R.int(2, 12), b = R.nonzero(-15, 15); const rhs = a * x + b;
    return { type: 'num', text: `Lös ekvationen ${m(`${T.lin(a, b, v)} = ${T.n(rhs)}`)}`, answer: x, level, variable: v,
      steps: [`Gör samma sak på båda sidor. Ta bort ${m(T.n(b))}: ${m(`${a}${v}${T.signed(b)}${T.signed(-b)} = ${T.n(rhs)}${T.signed(-b)}`)}`, `${m(`${a}${v} = ${a * x}`)}`, `Dela båda sidor med ${a}: ${m(`${v} = ${x}`)}`, vlhl(`${a} · ${x}${T.signed(b)}`, T.n(rhs), x)],
      hint: `Flytta talet först (gör motsatt räknesätt på båda sidor), dela sedan med ${a}.` };
  }
  if (level === 2) {
    // ax + b = cx + d, with variable on both sides (4z + z + 3 = 10 + 2z + 8 style)
    const x = R.int(2, 10), c = R.int(1, 5), a = c + R.int(1, 5), b = R.nonzero(-12, 12); const d = a * x + b - c * x;
    const variant = R.int(1, 2);
    if (variant === 1) {
      return { type: 'num', text: `Lös ekvationen ${m(`${T.lin(a, b, v)} = ${T.lin(c, d, v)}`)}`, answer: x, level, variable: v,
        steps: [`Samla ${v}-termerna på en sida: ta bort ${m(T.term(c, v))} från båda sidor → ${m(`${T.term(a - c, v)}${T.signed(b)} = ${T.n(d)}`)}`, `Ta bort ${m(T.n(b))} från båda sidor → ${m(`${T.term(a - c, v)} = ${T.n(d - b)}`)}`, `Dela med ${a - c}: ${m(`${v} = ${x}`)}`, vlhl(`${a} · ${x}${T.signed(b)}`, `${T.n(a * x + b)}`, x) + `, H.L. = ${m(`${c} · ${x}${T.signed(d)} = ${T.n(c * x + d)}`)}`],
        hint: `Få alla ${v} på ena sidan och alla tal på andra. Gör alltid samma sak på båda sidor.` };
    }
    // 4z + z + 3 = 10 + 2z + 8
    const p1 = R.int(2, 5), p2 = R.int(1, 3), k1 = R.int(1, 9), q1 = R.int(1, 3), k2 = R.int(1, 9);
    const lhsCoef = p1 + p2, rhsCoef = q1; const xx = R.int(2, 9); const rhsConst = (lhsCoef - rhsCoef) * xx + k1; // ensure integer solution
    const k2b = rhsConst - k2;
    return { type: 'num', text: `Lös ekvationen ${m(`${p1}${v} + ${p2}${v} + ${k1} = ${k2}${T.signed(q1, v)}${T.signed(k2b)}`)}`, answer: xx, level, variable: v,
      steps: [`Förenkla båda sidor först: V.L. ${m(`${lhsCoef}${v} + ${k1}`)}, H.L. ${m(`${T.lin(q1, rhsConst, v)}`)}`, `Ta bort ${m(T.term(q1, v))} från båda sidor: ${m(`${T.term(lhsCoef - q1, v)} + ${k1} = ${rhsConst}`)}`, `Ta bort ${k1}: ${m(`${T.term(lhsCoef - q1, v)} = ${rhsConst - k1}`)}`, `Dela med ${lhsCoef - q1}: ${m(`${v} = ${xx}`)}`, vlhl(`${p1} · ${xx} + ${p2} · ${xx} + ${k1}`, `${lhsCoef * xx + k1}`, xx)],
      hint: 'Förenkla varje sida för sig först (slå ihop lika termer). Samla sedan variablerna på en sida.' };
  }
  // level 3: ekvationer med parenteser (§2.6)
  const variant = R.int(1, 3);
  if (variant === 1) {
    // 11 = 9a − (5a + 1)
    const c = R.int(1, 4), a = c + R.int(2, 6), k = R.int(1, 6), x = R.int(2, 9); const lhs = (a - c) * x - k;
    return { type: 'num', text: `Lös ekvationen ${m(`${T.n(lhs)} = ${a}${v} − (${c}${v} + ${k})`)}`, answer: x, level, variable: v,
      steps: [`Minus framför parentesen – byt tecken inuti: ${m(`${T.n(lhs)} = ${a}${v} − ${c}${v} − ${k}`)}`, `Förenkla H.L.: ${m(`${T.n(lhs)} = ${T.term(a - c, v)} − ${k}`)}`, `Lägg till ${k} på båda sidor: ${m(`${lhs + k} = ${T.term(a - c, v)}`)}`, `Dela med ${a - c}: ${m(`${v} = ${x}`)}`, vlhl(`${a} · ${x} − (${c} · ${x} + ${k})`, `${a * x} − ${c * x + k} = ${T.n(lhs)}`, x)],
      hint: 'Ta bort parentesen först (byt tecken eftersom det står minus framför), förenkla sedan.' };
  }
  if (variant === 2) {
    // 5b − (2 + 3b) + 3 = 17
    const c = R.int(1, 4), a = c + R.int(1, 5), k = R.int(1, 5), e = R.int(1, 6), x = R.int(2, 9); const rhs = (a - c) * x - k + e;
    return { type: 'num', text: `Lös ekvationen ${m(`${a}${v} − (${k} + ${c}${v}) + ${e} = ${rhs}`)}`, answer: x, level, variable: v,
      steps: [`Byt tecken i parentesen: ${m(`${a}${v} − ${k} − ${c}${v} + ${e} = ${rhs}`)}`, `Förenkla V.L.: ${m(`${T.term(a - c, v)}${T.signed(e - k)} = ${rhs}`)}`, `Flytta talet: ${m(`${T.term(a - c, v)} = ${rhs - (e - k)}`)}`, `Dela med ${a - c}: ${m(`${v} = ${x}`)}`, vlhl(`${a} · ${x} − (${k} + ${c} · ${x}) + ${e}`, `${a * x} − ${k + c * x} + ${e} = ${rhs}`, x)],
      hint: 'Parentesen har minus framför: båda termerna inuti byter tecken.' };
  }
  // 4(x − 3) = 46 − 6(3 + x)
  const a = R.int(2, 5), b = R.int(1, 5), d = R.int(2, 6), e = R.int(1, 5), x = R.int(2, 8); const k = a * (x - b) + d * (e + x);
  return { type: 'num', text: `Lös ekvationen ${m(`${a}(${v} − ${b}) = ${k} − ${d}(${e} + ${v})`)}`, answer: x, level, variable: v,
    steps: [`Multiplicera in på båda sidor: ${m(`${a}${v} − ${a * b} = ${k} − ${d * e} − ${d}${v}`)}`, `Förenkla H.L.: ${m(`${a}${v} − ${a * b} = ${k - d * e} − ${d}${v}`)}`, `Lägg till ${m(`${d}${v}`)} på båda sidor: ${m(`${a + d}${v} − ${a * b} = ${k - d * e}`)}`, `Lägg till ${a * b}: ${m(`${a + d}${v} = ${k - d * e + a * b}`)}`, `Dela med ${a + d}: ${m(`${v} = ${x}`)}`, vlhl(`${a}(${x} − ${b})`, `${a * (x - b)}`, x) + `, H.L. = ${m(`${k} − ${d}(${e} + ${x}) = ${k} − ${d * (e + x)} = ${a * (x - b)}`)}`],
    hint: 'Multiplicera in i båda parenteserna först. Samla sedan variablerna på en sida.' };
}

    case 'askar': { const x = R.int(5, 30), k = R.int(2, 4), extra = R.int(1, 9); const total = x + k * x + extra; return { type: 'num', text: `I ask A finns ${m('x')} stickor. I ask B finns ${k} gånger så många. Dessutom ligger ${extra} stickor på bordet. Sammanlagt är det ${total} stickor. Hur många stickor finns i ask A?`, answer: x, level, steps: [`Ask A: ${m('x')}, ask B: ${m(`${k}x`)}, bordet: ${extra}.`, `Ekvation: ${m(`x + ${k}x + ${extra} = ${total}`)}`, `${m(`${k + 1}x + ${extra} = ${total}`)} → ${m(`${k + 1}x = ${total - extra}`)}`, `${m(`x = ${x}`)}`, `Kontroll: ${m(`${x} + ${k * x} + ${extra} = ${total}`)} ✓`], hint: 'Skriv ett uttryck för varje ask, lägg ihop allt och sätt lika med totalen.' }; }

function buildLesson(p, deck, n = 10, opts = {}) {
  const now = Date.now();
  const due = deck.words.filter(w => p.words[w.id] && p.words[w.id].due <= now);

  const notDue = deck.words.filter(w => p.words[w.id] && p.words[w.id].due > now);

  const newWords = R.shuffle(fresh).slice(0, newCount);

  if (pool.length >= 5 && !opts.noMatch) { const pairs = R.shuffle(pool).slice(0, 5); items.push({ kind: 'match', pairs, deck }); }

  const intros = items.filter(i => i.kind === 'intro'); const rest = items.filter(i => i.kind !== 'intro');

function makeWordExercise(deck, word, kind) {
  if (kind === 'pick' || kind === 'pickRev') {

}

const recentQ = {};
function makeSoGen(topic) {
  return function gen(level, opts = {}) {
    if (!opts.noOpen && typeof makeOrderQuestion === 'function' && R.chance(0.15)) { const oq = makeOrderQuestion(topic.id, level); if (oq) return oq; }
    if (!opts.noOpen && typeof makeOpenQuestion === 'function' && R.chance(level >= 2 ? 0.4 : 0.25)) { const oq = makeOpenQuestion(topic.id, level); if (oq) return oq; }
    const recent = recentQ[topic.id] || (recentQ[topic.id] = []);
    let pool = topic.qs.filter(q => !recent.includes(q));
    if (!pool.length) { recent.length = 0; pool = topic.qs.slice(); }
    const item = R.pick(pool); recent.push(item); if (recent.length > Math.max(3, topic.qs.length - 2)) recent.shift();
    if (item.num) return { type: 'num', text: item.q, answer: item.answer, steps: [item.why], hint: 'Multiplicera centimetrarna på kartan med skalans tal. 100 cm = 1 m, 1 000 m = 1 km.', level };
    const correct = item.choices[0];
    const choices = R.shuffle(item.choices.slice());
    return { type: 'choicetext', text: item.q, choices, answer: choices.indexOf(correct), steps: [item.why], hint: 'Tänk efter vad kapitlet handlade om – ett alternativ passar bäst.', level };
  };
}

const normOpen = (s) => s.toLowerCase().replace(/[^a-z0-9åäöé⁺⁻+:,\s]/g, ' ').replace(/\s+/g, ' ');
function checkOpen(q, raw) {
  const a = normOpen(raw || '');
  if (a.trim().length < 3) return { status: 'empty' };
  const hit = [], miss = [];
  for (const k of q.keys) { if (k.alts.some(alt => a.includes(normOpen(alt).trim()))) hit.push(k); else miss.push(k); }
  const score = hit.length / q.keys.length;
  const need = q.keys.length <= 2 ? 1 : Math.ceil(q.keys.length * 0.6);
  return { status: hit.length >= need ? 'correct' : 'wrong', hit, miss, score };
}

}

/* ========= Visual math: inline SVG figures (theme-aware via CSS variables) ========= */
const VIS = {
  clock(h, mm, size = 180) {
    const r = size / 2, c = r; const hourAng = ((h % 12) + mm / 60) * 30, minAng = mm * 6;
    const pt = (ang, len) => { const a = (ang - 90) * Math.PI / 180; return [c + len * Math.cos(a), c + len * Math.sin(a)]; };
    let ticks = ''; for (let i = 0; i < 60; i++) { const [x1, y1] = pt(i * 6, r - 6), [x2, y2] = pt(i * 6, r - (i % 5 ? 10 : 18)); ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--ink)" stroke-width="${i % 5 ? 1.5 : 3}" stroke-linecap="round"/>`; }
    let nums = ''; for (let i = 1; i <= 12; i++) { const [x, y] = pt(i * 30, r - 32); nums += `<text x="${x.toFixed(1)}" y="${(y + 6).toFixed(1)}" text-anchor="middle" font-size="${size * 0.095}" font-weight="700" fill="var(--ink)" font-family="var(--display)">${i}</text>`; }
    const [hx, hy] = pt(hourAng, r * 0.5), [mx, my] = pt(minAng, r * 0.74);
    return `<svg class="fig" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Klocka som visar ${h}:${String(mm).padStart(2, '0')}"><circle cx="${c}" cy="${c}" r="${r - 2}" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>${ticks}${nums}<line x1="${c}" y1="${c}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/><line x1="${c}" y1="${c}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="var(--acc)" stroke-width="5" stroke-linecap="round"/><circle cx="${c}" cy="${c}" r="6" fill="var(--acc)"/></svg>`;
  },
  // pizza / circle split into d parts, n shaded
  pie(n, d, size = 160) {
    const r = size / 2 - 4, c = size / 2; let parts = '';
    for (let i = 0; i < d; i++) {
      const a0 = (i / d) * 2 * Math.PI - Math.PI / 2, a1 = ((i + 1) / d) * 2 * Math.PI - Math.PI / 2;
      const x0 = c + r * Math.cos(a0), y0 = c + r * Math.sin(a0), x1 = c + r * Math.cos(a1), y1 = c + r * Math.sin(a1);
      parts += `<path d="M${c},${c} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${d === 1 ? 1 : 0},1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${i < n ? 'var(--acc)' : 'var(--card)'}" stroke="var(--ink)" stroke-width="2.5"/>`;
    }
    return `<svg class="fig" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${n} av ${d} delar färgade">${parts}</svg>`;
  },
  // horizontal bar split in d parts, n shaded
  bar(n, d, w = 260, h = 44) {
    let parts = ''; const pw = (w - 4) / d;
    for (let i = 0; i < d; i++) parts += `<rect x="${(2 + i * pw).toFixed(1)}" y="2" width="${pw.toFixed(1)}" height="${h - 4}" fill="${i < n ? 'var(--acc)' : 'var(--card)'}" stroke="var(--ink)" stroke-width="2"/>`;
    return `<svg class="fig" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${n} av ${d} delar färgade">${parts}</svg>`;
  },
  // number line from a to b with step, optional marks {value,label}
  numberLine(a, b, step, marks = [], w = 300) {
    const pad = 16, usable = w - 2 * pad; const x = (v) => pad + ((v - a) / (b - a)) * usable;
    let ticks = ''; for (let v = a; v <= b; v += step) { const big = ((v - a) / step) % 5 === 0; ticks += `<line x1="${x(v).toFixed(1)}" y1="${big ? 22 : 28}" x2="${x(v).toFixed(1)}" y2="40" stroke="var(--ink)" stroke-width="${big ? 2.5 : 1.5}"/>${big ? `<text x="${x(v).toFixed(1)}" y="58" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--body)">${v}</text>` : ''}`; }
    const ms = marks.map(m => `<circle cx="${x(m.value).toFixed(1)}" cy="34" r="7" fill="${m.color || 'var(--acc)'}"/><text x="${x(m.value).toFixed(1)}" y="14" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="var(--display)">${m.label ?? ''}</text>`).join('');
    return `<svg class="fig" viewBox="0 0 ${w} 64" width="${w}" height="64" role="img" aria-label="Tallinje från ${a} till ${b}"><line x1="${pad}" y1="34" x2="${w - pad}" y2="34" stroke="var(--ink)" stroke-width="2.5"/><polygon points="${w - pad},34 ${w - pad - 8},29 ${w - pad - 8},39" fill="var(--ink)"/>${ticks}${ms}</svg>`;
  },
  // rectangle with grid cells (a × b), labels on sides; grid optional
  rect(a, b, opts = {}) {
    const cell = Math.min(26, Math.floor(220 / Math.max(a, b))); const W = a * cell, H = b * cell; const pad = 26;
    let cells = ''; if (opts.grid) for (let i = 0; i < a; i++) for (let j = 0; j < b; j++) cells += `<rect x="${pad + i * cell}" y="${pad + j * cell}" width="${cell}" height="${cell}" fill="var(--acc-soft)" stroke="var(--line)" stroke-width="1"/>`;
    const la = opts.labelA ?? `${a} cm`, lb = opts.labelB ?? `${b} cm`;
    return `<svg class="fig" viewBox="0 0 ${W + 2 * pad + 50} ${H + 2 * pad}" width="${W + 2 * pad + 50}" height="${H + 2 * pad}" role="img" aria-label="Rektangel ${la} gånger ${lb}">${cells}<rect x="${pad}" y="${pad}" width="${W}" height="${H}" fill="${opts.grid ? 'none' : 'var(--acc-soft)'}" stroke="var(--ink)" stroke-width="2.5"/><text x="${pad + W / 2}" y="${pad - 8}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)" font-family="var(--display)">${la}</text><text x="${pad + W + 8}" y="${pad + H / 2 + 5}" font-size="14" font-weight="700" fill="var(--ink)" font-family="var(--display)">${lb}</text></svg>`;
  },
  // coins row
  coins(counts) {
    const order = [['10', 44, '#d9b84a'], ['5', 38, '#d9b84a'], ['1', 32, '#c9ccd3']]; let x = 4, out = '';
    for (const [v, d, col] of order) for (let i = 0; i < (counts[v] || 0); i++) { out += `<circle cx="${x + d / 2}" cy="30" r="${d / 2}" fill="${col}" stroke="var(--ink)" stroke-width="2"/><text x="${x + d / 2}" y="35" text-anchor="middle" font-size="${d * 0.4}" font-weight="800" fill="#1d2433" font-family="var(--display)">${v}</text>`; x += d + 8; }
    return `<svg class="fig" viewBox="0 0 ${Math.max(60, x)} 60" width="${Math.max(60, x)}" height="60" role="img" aria-label="Mynt">${out}</svg>`;
  },
  // simple shapes
  shape(name, size = 120) {
    const c = size / 2, r = size / 2 - 8; const poly = (n, rot = -90) => Array.from({ length: n }, (_, i) => { const a = (rot + i * 360 / n) * Math.PI / 180; return `${(c + r * Math.cos(a)).toFixed(1)},${(c + r * Math.sin(a)).toFixed(1)}`; }).join(' ');
    const body = name === 'cirkel' ? `<circle cx="${c}" cy="${c}" r="${r}"/>` : name === 'kvadrat' ? `<rect x="10" y="10" width="${size - 20}" height="${size - 20}"/>` : name === 'rektangel' ? `<rect x="6" y="${size * 0.25}" width="${size - 12}" height="${size * 0.5}"/>` : name === 'triangel' ? `<polygon points="${poly(3)}"/>` : name === 'femhörning' ? `<polygon points="${poly(5)}"/>` : `<polygon points="${poly(6)}"/>`;
    return `<svg class="fig" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${name}"><g fill="var(--acc-soft)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round">${body}</g></svg>`;
  },
};

const timeStr = (h, mm) => `${h}:${String(mm).padStart(2, '0')}`;
const timeAnswers = (h, mm) => { const a = [timeStr(h, mm), timeStr(h % 12 === 0 ? 12 : h % 12, mm), `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`, timeStr(h, mm).replace(':', '.'), timeStr(h % 12 === 0 ? 12 : h % 12, mm).replace(':', '.')]; if (h >= 12 && h % 12 !== 0) a.push(timeStr(h - 12, mm)); return [...new Set(a)]; };

    if (variant === 2) { const [a, b] = R.pick([[2, 3], [2, 4], [3, 4], [2, 5], [3, 5], [4, 8], [2, 8]]); const first = R.chance(0.5); const ch = first ? [`1/${a}`, `1/${b}`] : [`1/${b}`, `1/${a}`]; return { type: 'choicetext', text: `Vilket bråk är <b>störst</b>?`, choices: ch, answer: ch.indexOf(`1/${a}`), level, steps: [`Ju fler delar man delar något i, desto mindre blir varje del.`, `1/${a} betyder att hela delas i ${a} delar, 1/${b} i ${b} delar.`, `Alltså är ${m(`1/${a}`)} större än ${m(`1/${b}`)}.`], hint: 'Tänk på en pizza: en bit av tre eller en bit av fem – vilken är störst?' }; }
    const d = R.pick([2, 4, 5, 10]), total = d * R.int(2, 6); return { type: 'num', fig: VIS.bar(1, d), text: `Hur mycket är ${m(`1/${d}`)} av ${total}?`, answer: total / d, level, steps: [`${m(`1/${d}`)} av något betyder dela i ${d} lika delar.`, `${m(`${total} / ${d} = ${total / d}`)}`], hint: `Dela ${total} med ${d}.`, choices: T.choices(total / d, 4, 3) };
  }
  if (level === 2) {

/* ---- Åk 4: geometri (omkrets & area) ---- */

/* ---- Åk 4: enheter ---- */

  ['mycket', ['myket', 'mycet'], 3], ['nästan', ['nestan', 'nässtan'], 3], ['dricka', ['drika', 'dricker'], 3], ['bröd', ['brö', 'bröd '], 3], ['tänka', ['tenka', 'tängka'], 3], ['hälsa', ['helsa', 'hällsa'], 3],

];
SV.genStavning = (level) => {
  const pool = SV.STAV.filter(w => w[2] <= level);
  const [word, wrongs] = R.pick(pool);
  const mode = R.pick(level === 1 ? ['pick', 'pick', 'dictate'] : ['pick', 'dictate', 'dictate', 'gap']);
  const why = (w) => /([a-zåäö])\1/.test(w) ? `Kort vokal → dubbelteckna konsonanten: <b>${w}</b>.` : /ng/.test(w) ? `Ng-ljudet stavas med <b>ng</b>: <b>${w}</b>.` : /^(sj|skj|stj|sk[eiyäö]|sch|ch)/.test(w) ? `Sj-ljudet kan stavas sj, skj, stj eller sk framför e, i, y, ä, ö: <b>${w}</b>.` : /^(tj|k[eiyäö])/.test(w) ? `Tj-ljudet stavas tj eller k framför e, i, y, ä, ö: <b>${w}</b>.` : /^(hj|gj|lj|dj|g[eiyäö])/.test(w) ? `J-ljudet kan stavas hj, gj, lj, dj eller g: <b>${w}</b>.` : `Rätt stavning: <b>${w}</b>.`;
  if (mode === 'pick') {
    const choices = R.shuffle(uniq([word, ...wrongs]).slice(0, 3));
    return { type: 'choicetext', text: 'Vilket ord är rätt stavat?', choices, answer: choices.indexOf(word), steps: [why(word)], hint: 'Säg ordet långsamt. Är vokalen kort eller lång?', level, fig: svSpeak(word) };
  }
  if (mode === 'gap') {
    // ta bort den kritiska delen
    const m = word.match(/([a-zåäö])\1|ng|^(sj|skj|stj|sch|ch|tj|hj|gj|lj|dj|sk|k|g)/);
    const part = m ? m[0] : word.slice(0, 2); const idx = word.indexOf(part);
    const gapped = word.slice(0, idx) + '_'.repeat(part.length) + word.slice(idx + part.length);
    return { type: 'text', text: `Vilka bokstäver saknas? <b>${gapped}</b>`, answer: [part, word], display: word, steps: [why(word)], hint: `Hela ordet är ${word.length} bokstäver. Lyssna igen.`, level, fig: svSpeak(word) };
  }
  return { type: 'text', text: 'Lyssna och skriv ordet.', answer: [word], steps: [why(word)], hint: `Ordet börjar på <b>${word[0]}</b> och har ${word.length} bokstäver.`, level, fig: svSpeak(word) };
};

/* ---------- Ordklasser ---------- */
SV.SUBST = ['hund', 'bil', 'skola', 'bok', 'sol', 'stol', 'flicka', 'pojke', 'äpple', 'hus', 'katt', 'cykel', 'blomma', 'tröja', 'fisk', 'tåg', 'lärare', 'mamma', 'skog', 'boll'];
SV.VERB = ['springer', 'hoppar', 'läser', 'sover', 'äter', 'skrattar', 'simmar', 'sjunger', 'ritar', 'cyklar', 'leker', 'bakar', 'gråter', 'klättrar', 'dansar', 'skriver', 'tittar', 'dricker', 'bygger', 'städar'];
SV.ADJ = ['röd', 'stor', 'glad', 'liten', 'snabb', 'varm', 'mjuk', 'hög', 'kall', 'söt', 'gammal', 'tung', 'ljus', 'arg', 'trött', 'blöt', 'lång', 'tyst', 'vacker', 'hungrig'];
SV.MENINGAR = [
  ['Den lilla hunden springer i parken.', { subst: ['hunden', 'parken'], verb: ['springer'], adj: ['lilla'] }],
  ['Mamma bakar goda bullar.', { subst: ['Mamma', 'bullar'], verb: ['bakar'], adj: ['goda'] }],

  ['Den trötta björnen sover hela vintern.', { subst: ['björnen', 'vintern'], verb: ['sover'], adj: ['trötta'] }],
];
const KLASS = { subst: 'substantiv', verb: 'verb', adj: 'adjektiv' };
const KLASS_WHY = { subst: 'Substantiv är namn på saker, djur, människor och platser – man kan sätta <b>en</b> eller <b>ett</b> framför.', verb: 'Verb är något man <b>gör</b> eller något som händer – man kan sätta <b>att</b> framför.', adj: 'Adjektiv beskriver <b>hur</b> något är – man kan sätta <b>är</b> framför: "är röd".' };
SV.genOrdklass = (level) => {
  const kinds = ['subst', 'verb', 'adj'];
  if (level === 1 || (level === 2 && R.chance(0.5))) {
    const k = R.pick(kinds); const bank = { subst: SV.SUBST, verb: SV.VERB, adj: SV.ADJ };
    const correct = R.pick(bank[k]); const others = kinds.filter(x => x !== k).map(x => R.pick(bank[x]));
    const choices = R.shuffle([correct, ...others]);
    return { type: 'choicetext', text: `Vilket ord är ett <b>${KLASS[k]}</b>?`, choices, answer: choices.indexOf(correct), steps: [KLASS_WHY[k]], hint: k === 'verb' ? 'Vilket ord kan man göra?' : k === 'adj' ? 'Vilket ord beskriver hur något är?' : 'Vilket ord kan man sätta en/ett framför?', level };
  }
  if (level === 2) {
    const k = R.pick(kinds); const bank = { subst: SV.SUBST, verb: SV.VERB, adj: SV.ADJ }; const w = R.pick(bank[k]);
    const choices = R.shuffle(['substantiv', 'verb', 'adjektiv']);
    return { type: 'choicetext', text: `Vilken ordklass tillhör ordet <b>${w}</b>?`, choices, answer: choices.indexOf(KLASS[k]), steps: [KLASS_WHY[k]], hint: 'Testa: "en/ett …", "att …" eller "är …". Vilket passar?', level };
  }
  const [sent, parts] = R.pick(SV.MENINGAR); const k = R.pick(kinds.filter(x => parts[x].length));
  const words = sent.replace(/[.!?]/g, '').split(' ');
  const correct = parts[k][0]; const wrong = R.shuffle(words.filter(w => !parts[k].includes(w) && !['Den', 'en', 'på', 'i', 'med', 'hela'].includes(w))).slice(0, 3);
  const choices = R.shuffle([correct, ...wrong]);
  return { type: 'choicetext', text: `Hitta ett <b>${KLASS[k]}</b> i meningen:<br><i>${sent}</i>`, choices, answer: choices.indexOf(correct), steps: [KLASS_WHY[k]], hint: k === 'verb' ? 'Vad gör någon i meningen?' : k === 'adj' ? 'Vilket ord beskriver hur något är?' : 'Vem eller vad handlar meningen om?', level };
};

/* ---------- Bokstavsordning ---------- */
SV.genAbc = (level) => {
  const bank = uniq([...SV.SUBST, ...SV.ADJ, 'apa', 'banan', 'citron', 'delfin', 'elefant', 'fisk', 'giraff', 'hare', 'igelkott', 'jordgubbe', 'kanin', 'lejon', 'mus', 'noshörning', 'orm', 'panda', 'räv', 'sköldpadda', 'tiger', 'uggla', 'val', 'zebra', 'älg', 'örn']);
  let words;
  if (level === 1) { words = []; const used = new Set(); for (const w of R.shuffle(bank)) { if (!used.has(w[0])) { used.add(w[0]); words.push(w); } if (words.length === 4) break; } }
  else if (level === 2) { const byFirst = {}; bank.forEach(w => (byFirst[w[0]] = byFirst[w[0]] || []).push(w)); const groups = Object.values(byFirst).filter(g => g.length >= 2); const g = R.pick(groups); words = uniq([...R.shuffle(g).slice(0, 2), ...R.shuffle(bank.filter(w => w[0] !== g[0][0])).slice(0, 3)]); }
  else { const byFirst = {}; bank.forEach(w => (byFirst[w[0]] = byFirst[w[0]] || []).push(w)); const groups = Object.values(byFirst).filter(g => g.length >= 3); const g = R.pick(groups); words = uniq([...R.shuffle(g).slice(0, 3), ...R.shuffle(bank.filter(w => w[0] !== g[0][0])).slice(0, 3)]); }
  const sorted = words.slice().sort((x, y) => x.localeCompare(y, 'sv'));
  return { type: 'order', text: 'Sätt orden i bokstavsordning (som i en ordbok):', items: sorted, answer: sorted, steps: [`<b>Rätt ordning:</b> ${sorted.join(', ')}.`, level > 1 ? 'Börjar två ord på samma bokstav? Titta på <b>andra</b> bokstaven.' : 'Alfabetet: a b c d e f g h i j k l m n o p q r s t u v w x y z å ä ö.'], hint: 'Sjung alfabetet tyst för dig själv.', level };
};

SV.TEMPUS = [['springer', 'sprang', 'har sprungit'], ['äter', 'åt', 'har ätit'], ['sover', 'sov', 'har sovit'], ['läser', 'läste', 'har läst'], ['hoppar', 'hoppade', 'har hoppat'], ['skriver', 'skrev', 'har skrivit'], ['dricker', 'drack', 'har druckit'], ['går', 'gick', 'har gått'], ['ser', 'såg', 'har sett'], ['sitter', 'satt', 'har suttit'], ['simmar', 'simmade', 'har simmat'], ['leker', 'lekte', 'har lekt'], ['kommer', 'kom', 'har kommit'], ['får', 'fick', 'har fått'], ['ger', 'gav', 'har gett'], ['säger', 'sa', 'har sagt']];
SV.genBojning = (level) => {
  if (level === 1 || (level === 2 && R.chance(0.5))) {
    const [one, many] = R.pick(SV.PLURAL);
    if (level === 1) { const wrongs = R.shuffle(SV.PLURAL.filter(p => p[0] !== one).map(p => p[1])).slice(0, 3); const choices = R.shuffle([many, ...wrongs]); return { type: 'choicetext', text: `En <b>${one}</b> – flera …?`, choices, answer: choices.indexOf(many), steps: [`En ${one}, flera <b>${many}</b>.`], hint: 'Säg "flera …" högt. Vad låter rätt?', level }; }

  }

  { lvl: 3, title: 'Allemansrätten', text: 'I Sverige har vi något som kallas allemansrätten. Den betyder att alla får vara i naturen, även på mark som någon annan äger. Du får plocka bär, svamp och blommor, tälta en natt och bada i sjöar. Men det finns regler: du får inte gå nära någons hus, inte bryta grenar från levande träd och inte lämna skräp efter dig. Man brukar säga: inte störa, inte förstöra.', qs: [['Vad betyder allemansrätten?', ['Alla får vara i naturen', 'Alla får bygga hus i skogen', 'Alla äger skogen', 'Bara barn får vara i skogen']], ['Vilket av detta får du göra?', ['Plocka bär och svamp', 'Bryta grenar från levande träd', 'Lämna skräp', 'Gå in i någons trädgård']], ['Hur länge får man tälta på samma plats?', ['En natt', 'En vecka', 'En månad', 'Hur länge som helst']], ['Vilken regel sammanfattar allemansrätten?', ['Inte störa, inte förstöra', 'Alltid fråga först', 'Bara på dagen', 'Ta med allt du hittar']]] },

SV.genLasa = (level) => {
  const pool = SV.TEXTER.filter(t => t.lvl <= level && t.lvl >= Math.max(1, level - 1)); const t = R.pick(pool); const [q, ch] = R.pick(t.qs);
  const correct = ch[0]; const choices = R.shuffle(ch.slice());
  return { type: 'choicetext', text: q, choices, answer: choices.indexOf(correct), steps: [`Svaret står i texten: <b>${correct}</b>.`], hint: 'Läs texten en gång till och leta efter orden i frågan.', level, fig: svRead(`<div class="row" style="justify-content:space-between;align-items:center"><div class="eyebrow">${t.title}</div>${typeof TTS !== 'undefined' && TTS.ok ? `<button class="pill" data-speak="${esc(t.text)}" data-lang="sv" data-rate="0.85">🔊 Lyssna</button>` : ''}</div><p>${t.text}</p>`) };
};

SV.genRim = (level) => {
  const g = R.pick(SV.RIM); const [a, b] = R.shuffle(g).slice(0, 2);

// Generator: 75 % flervalsfråga, 25 % sätt-i-ordning (när ämnet har sådana), undviker upprepning
const recentNS = {};
function makeNaSoGen(topic) {
  return function gen(level, opts = {}) {
    const recent = recentNS[topic.id] || (recentNS[topic.id] = []);
    const orders = topic.qs.filter(q => q.order); const plain = topic.qs.filter(q => !q.order);
    if (!opts.noOpen && orders.length && R.chance(level >= 2 ? 0.3 : 0.2)) {
      const o = R.pick(orders);
      return { type: 'order', text: o.q, items: o.items.slice(), answer: o.items, steps: [`<b>Rätt ordning:</b> ${o.items.join(' → ')}`, o.why], hint: 'Vad kommer först?', level };
    }
    let pool = plain.filter(q => !recent.includes(q)); if (!pool.length) { recent.length = 0; pool = plain.slice(); }
    const item = R.pick(pool); recent.push(item); if (recent.length > Math.max(3, plain.length - 2)) recent.shift();
    const correct = item.choices[0]; const choices = R.shuffle(item.choices.slice(0, level === 1 ? 3 : 4));
    return { type: 'choicetext', text: item.q, choices, answer: choices.indexOf(correct), steps: [item.why], hint: 'Läs på-sidan har svaret. Ett alternativ passar bäst.', level };
  };
}
const lgrTag = (t, subj) => `<div class="eyebrow" style="margin-bottom:6px">Lgr22 · ${subj} åk 1–3</div><p class="muted" style="font-size:.9rem;margin:0 0 10px"><i>${t.lgr}</i></p>`;
const NASO_SKILLS = {
  ak2: [
    ...NO2.map(t => ({ id: t.id, name: t.name, short: t.short, icon: t.icon, group: 'no', subject: 'NO', gen: makeNaSoGen(t), method: lgrTag(t, 'NO') + t.read })),
    ...SO2.map(t => ({ id: t.id, name: t.name, short: t.short, icon: t.icon, group: 'so', subject: 'SO', gen: makeNaSoGen(t), method: lgrTag(t, 'SO') + t.read })),
  ],
};

/* ========= Åk 2-mallen: matte som växer – nivå 4 på befintliga moment + nya moment enligt Lgr22 åk 1–3 ========= */
// Lgr22 matematik åk 1–3 (centralt innehåll): naturliga tal 0–1000 och positionssystemet, de fyra räknesätten,
// huvudräkning och skriftliga metoder, enkla bråk, likhetstecknet, mönster i talföljder, geometriska objekt och
// symmetri, mätning av längd/massa/volym/tid, tabeller och diagram, problemlösning.

const L4 = {
  plus20: () => { // nivå 4: plus till 100 med tiotalsövergång
    const a = R.int(23, 78), b = R.int(5, 99 - a); if ((a % 10) + (b % 10) < 10) return L4.plus20();
    const ans = a + b; return { type: 'num', text: `${m(`${a} + ${b}`)} = ?`, answer: ans, level: 4, steps: [`Tiotalen först: ${m(`${a} + ${Math.floor(b / 10) * 10} = ${a + Math.floor(b / 10) * 10}`)}`, `Sedan entalen: ${m(`${a + Math.floor(b / 10) * 10} + ${b % 10} = ${ans}`)}`], hint: 'Lägg till tiotalen först, sedan entalen.' };
  },
  minus20: () => { // nivå 4: minus till 100 med tiotalsövergång
    const a = R.int(31, 99), b = R.int(5, a - 10); if ((a % 10) >= (b % 10)) return L4.minus20();
    const ans = a - b; return { type: 'num', text: `${m(`${a} − ${b}`)} = ?`, answer: ans, level: 4, steps: [`Ta bort tiotalen först: ${m(`${a} − ${Math.floor(b / 10) * 10} = ${a - Math.floor(b / 10) * 10}`)}`, `Sedan entalen: ${m(`${a - Math.floor(b / 10) * 10} − ${b % 10} = ${ans}`)}`], hint: 'Ta bort tiotalen först, sedan entalen.' };
  },
  tal100: () => { // nivå 4: tre tal, eller till 200
    if (R.chance(0.5)) { const a = R.int(10, 60), b = R.int(10, 60), c = R.int(5, 40); const ans = a + b + c; return { type: 'num', text: `${m(`${a} + ${b} + ${c}`)} = ?`, answer: ans, level: 4, steps: [`${m(`${a} + ${b} = ${a + b}`)}`, `${m(`${a + b} + ${c} = ${ans}`)}`], hint: 'Räkna ihop två tal i taget. Börja gärna med de som blir jämna tiotal.' }; }
    const a = R.int(101, 180), b = R.int(10, 199 - a); const add = R.chance(0.5); const ans = add ? a + b : a - b; return { type: 'num', text: `${m(`${a} ${add ? '+' : '−'} ${b}`)} = ?`, answer: ans, level: 4, steps: [`Hundratalet står kvar, räkna med resten: ${m(`${a - 100} ${add ? '+' : '−'} ${b} = ${ans - 100}`)}`, `Lägg tillbaka hundratalet: ${m(ans)}`], hint: 'Tänk bort hundratalet så länge.' };
  },
  dubbelt: () => { const half = R.chance(0.5); const base = R.int(26, 99); if (half) { const n = base * 2; return { type: 'num', text: `Hälften av ${m(n)} är?`, answer: base, level: 4, steps: [`Dela upp: hälften av ${Math.floor(n / 100) * 100 || Math.floor(n / 10) * 10} och hälften av resten.`, `${m(`${base} + ${base} = ${n}`)}`], hint: 'Ta hälften av tiotalen och hälften av entalen var för sig.' }; } return { type: 'num', text: `Dubbelt så mycket som ${m(base)} är?`, answer: base * 2, level: 4, steps: [`Dubbla tiotalen: ${Math.floor(base / 10) * 20}, dubbla entalen: ${(base % 10) * 2}`, `${m(`${Math.floor(base / 10) * 20} + ${(base % 10) * 2} = ${base * 2}`)}`], hint: 'Dubbla tiotalen och entalen var för sig.' }; },
  tabell: () => { const table = R.pick([3, 4, 6, 7, 8, 9]); const k = R.int(2, 10); const div = R.chance(0.35); if (div) return { type: 'num', text: `${m(`${table * k} / ${table}`)} = ?`, answer: k, level: 4, steps: [`Tänk: ${table} gånger vad blir ${table * k}?`, `${m(`${table} · ${k} = ${table * k}`)}, så svaret är ${m(k)}`], hint: `Hoppa ${table} i taget tills du kommer till ${table * k}. Hur många hopp?` }; return { type: 'num', text: `${m(`${k} · ${table}`)} = ?`, answer: k * table, level: 4, steps: [`${m(`${k} · ${table}`)} betyder ${k} stycken ${table}:or.`, table === 9 ? `Knep för 9:an: ${m(`${k} · 10 − ${k} = ${k * 9}`)}` : table === 4 ? `Knep för 4:an: dubbelt och dubbelt igen: ${m(`${k} · 2 = ${k * 2}, ${k * 2} · 2 = ${k * 4}`)}` : `${m(Array(Math.min(k, 5)).fill(table).join(' + ') + (k > 5 ? ' + …' : '') + ' = ' + k * table)}`], hint: `Kan du ${m(`${k} · ${table - 1}`)} eller ${m(`${k} · ${table + 1}`)}? Lägg till eller ta bort ${k}.`, choices: T.choices(k * table, 4, table) }; },
  saknas: () => { const mult = R.chance(0.4); if (mult) { const t = R.pick([2, 3, 4, 5, 10]), k = R.int(2, 10); return { type: 'num', text: `${m(`${t} · ▢ = ${t * k}`)} Vilket tal ska stå i rutan?`, answer: k, level: 4, steps: [`Hur många ${t}:or behövs för att komma till ${t * k}?`, `${m(`${t} · ${k} = ${t * k}`)}`], hint: `Hoppa ${t} i taget och räkna hoppen.` }; } const total = R.int(40, 200), a = R.int(10, total - 10), b = total - a; const add = R.chance(0.6); if (add) return { type: 'num', text: `${m(`▢ + ${b} = ${total}`)} Vilket tal ska stå i rutan?`, answer: a, level: 4, steps: [`Likhetstecknet betyder "lika mycket på båda sidor".`, `${m(`${total} − ${b} = ${a}`)}`], hint: 'Vad måste du lägga till för att det ska bli lika?' }; return { type: 'num', text: `${m(`${total} − ▢ = ${a}`)} Vilket tal ska stå i rutan?`, answer: b, level: 4, steps: [`${m(`${total} − ${a} = ${b}`)}`], hint: 'Hur stor är skillnaden mellan talen?' }; },
  klockan2: () => { const h = R.int(1, 12), mm = R.pick([5, 10, 20, 25, 35, 40, 50, 55]); const names = { 5: `fem över ${h}`, 10: `tio över ${h}`, 20: `tjugo över ${h}`, 25: `fem i halv ${h % 12 + 1}`, 35: `fem över halv ${h % 12 + 1}`, 40: `tjugo i ${h % 12 + 1}`, 50: `tio i ${h % 12 + 1}`, 55: `fem i ${h % 12 + 1}` }; const correct = names[mm]; const wrong = R.shuffle(Object.entries(names).filter(([k]) => Number(k) !== mm).map(([, v]) => v)).slice(0, 3); const choices = R.shuffle([correct, ...wrong]); return { type: 'choicetext', fig: VIS.clock(h, mm), text: 'Vad är klockan?', choices, answer: choices.indexOf(correct), level: 4, steps: [`Minutvisaren (den långa) pekar på ${mm / 5} → ${mm} minuter.`, `Klockan är <b>${correct}</b> (${h}:${String(mm).padStart(2, '0')}).`], hint: 'Varje siffra på urtavlan är 5 minuter för den långa visaren.' }; },
  pengar: () => { const n = R.pick(NAMES); const items = [['en bok', R.int(45, 95)], ['ett spel', R.int(100, 180)], ['en tröja', R.int(120, 199)], ['en boll', R.int(30, 80)], ['godis', R.int(15, 45)]]; const [i1, p1] = R.pick(items); let [i2, p2] = R.pick(items); while (i2 === i1) [i2, p2] = R.pick(items); const sum = p1 + p2; const pay = sum <= 200 ? 200 : 500; return { type: 'num', text: `${n} köper ${i1} för ${p1} kr och ${i2} för ${p2} kr och betalar med ${pay} kr. Hur mycket får ${n} tillbaka?`, answer: pay - sum, level: 4, steps: [`Först kostnaden: ${m(`${p1} + ${p2} = ${sum}`)} kr`, `Sedan växeln: ${m(`${pay} − ${sum} = ${pay - sum}`)} kr`], hint: 'Räkna först ut vad allt kostar tillsammans.' }; },
  former: () => { const q = R.pick([() => { const s = R.int(2, 9); return { type: 'num', fig: VIS.rect(s, s, { grid: true }), text: `Kvadraten har sidan ${s} rutor. Hur många rutor är arean?`, answer: s * s, level: 4, steps: [`Area = rader · kolumner = ${m(`${s} · ${s} = ${s * s}`)}`], hint: 'Räkna en rad och multiplicera med antalet rader.' }; }, () => { const a = R.int(2, 9), b = R.int(2, 9); return { type: 'num', fig: VIS.rect(a, b), text: `Rektangeln är ${a} cm bred och ${b} cm hög. Hur lång är omkretsen i cm?`, answer: 2 * (a + b), level: 4, steps: [`Omkrets = alla sidor: ${m(`${a} + ${b} + ${a} + ${b} = ${2 * (a + b)}`)}`], hint: 'Gå runt hela figuren och lägg ihop alla sidorna.' }; }, () => { const names = { kub: 6, rätblock: 6, cylinder: 3, kon: 2, klot: 1, pyramid: 5 }; const [nm, f] = R.pick(Object.entries(names)); const choices = R.shuffle([...new Set([f, ...R.shuffle([1, 2, 3, 5, 6]).filter(x => x !== f).slice(0, 3)])]); return { type: 'choicetext', text: `Hur många ytor (sidor) har en <b>${nm}</b>?`, choices: choices.map(String), answer: choices.indexOf(f), level: 4, steps: [`En ${nm} har ${f} ${f === 1 ? 'yta' : 'ytor'}.`, 'Kub och rätblock: 6, pyramid med fyrkantig botten: 5, cylinder: 3 (två cirklar + en böjd), kon: 2, klot: 1.'], hint: 'Tänk på en tärning, en burk, en strut, en boll.' }; }]); return q(); },
  talrad: () => { const step = R.pick([2, 3, 4, 5, 10, 25, 50, 100]); const start = step === 100 ? R.int(1, 5) * 100 : step === 50 ? R.int(1, 10) * 50 : step === 25 ? R.int(1, 8) * 25 : R.int(1, 30) * step; const down = R.chance(0.35); const seq = Array.from({ length: 5 }, (_, i) => down ? start + 4 * step - i * step : start + i * step); const pos = R.int(2, 4); const ans = seq[pos]; const shown = seq.map((v, i) => (i === pos ? '▢' : v)).join(', '); return { type: 'num', text: `Vilket tal saknas? ${m(shown)}`, answer: ans, level: 4, steps: [`Talen ${down ? 'minskar' : 'ökar'} med ${step} varje gång.`, `${m(`${seq[pos - 1]} ${down ? '−' : '+'} ${step} = ${ans}`)}`], hint: 'Hur mycket är det mellan två tal som står bredvid varandra?' }; },
};

/* ========= Cloud sync (only active in the self-hosted build with window.PLUGG_SYNC set) =========
   Data model: one Firestore document per child: families/{familyCode}/profiles/{kidId}
   fields: json (stringValue = the profile), updatedAt (integerValue, ms). Last-writer-wins with field-level merge.
   All requests go through SYNC.fetch, which adds the device's Firebase ID token when AUTH is available (see 04b_auth.js). */
const SYNC = {
  fetch(url, opts) { return (typeof AUTH !== 'undefined' && AUTH.ready) ? AUTH.fetch(url, opts) : fetch(url, opts); },
  cfg: (typeof window !== 'undefined' && window.PLUGG_SYNC && window.PLUGG_SYNC.projectId && window.PLUGG_SYNC.apiKey) ? window.PLUGG_SYNC : null,

  status: 'off', lastError: null, pushTimer: null, pending: new Set(), lastPull: {},
  url(kidId) { return `https://firestore.googleapis.com/v1/projects/${SYNC.cfg.projectId}/databases/(default)/documents/families/${encodeURIComponent(SYNC.family)}/profiles/${kidId}?key=${SYNC.cfg.apiKey}`; },
  async pull(kidId) {
    if (!SYNC.active) return null;
    try {
      const r = await SYNC.fetch(SYNC.url(kidId), { cache: 'no-store' });
      if (r.status === 404) { SYNC.status = 'ok'; return null; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const doc = await r.json(); const json = doc.fields?.json?.stringValue; const updatedAt = Number(doc.fields?.updatedAt?.integerValue || 0);

      SYNC.status = 'ok'; SYNC.lastError = null;
      return { profile: JSON.parse(json), updatedAt };
    } catch (e) { SYNC.status = 'error'; SYNC.lastError = e.message; return null; }
  },
  async push(kidId) {
    if (!SYNC.active) return false;
    const p = prof(kidId); const updatedAt = p.updatedAt || Date.now();
    try {
      const body = { fields: { json: { stringValue: JSON.stringify(p) }, updatedAt: { integerValue: String(updatedAt) }, kid: { stringValue: kidId } } };
      const r = await SYNC.fetch(SYNC.url(kidId), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      SYNC.status = 'ok'; SYNC.lastError = null; p.syncedAt = updatedAt; p.since = { xp: 0, gems: 0, days: {} }; p._lx = p.xp; p._lg = p.gems; return true;
    } catch (e) { SYNC.status = 'error'; SYNC.lastError = e.message; return false; }
  },
  schedulePush(kidId) { if (!SYNC.active || !kidId) return; SYNC.pending.add(kidId); clearTimeout(SYNC.pushTimer); SYNC.pushTimer = setTimeout(async () => { const ids = [...SYNC.pending]; SYNC.pending.clear(); for (const id of ids) await SYNC.push(id); SYNC.render(); }, 1500); },
  // Pull remote for a kid and merge into local. Returns true if local changed.
  async refresh(kidId) {
    const remote = await SYNC.pull(kidId); SYNC.lastPull[kidId] = Date.now();
    if (!remote) { if (SYNC.active && SYNC.status === 'ok') SYNC.schedulePush(kidId); return false; }
    const local = prof(kidId);
    // Tombstone: a parent deleted this child's data on another device → reset here instead of re-uploading our copy.
    if (remote.profile.resetAt && remote.profile.resetAt > (local.resetAt || 0)) { const fresh = { ...defaultProfile(kidId), resetAt: remote.profile.resetAt, syncedAt: remote.updatedAt, updatedAt: remote.updatedAt }; fresh._lx = fresh.xp; fresh._lg = fresh.gems; DB.profiles[kidId] = fresh; rollover(fresh); try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { /* ignore */ } return true; }
    if ((local.syncedAt || 0) >= remote.updatedAt) return false; // we already have this version
    const localChanged = (local.updatedAt || 0) > (local.syncedAt || 0);
    const merged = localChanged ? mergeProfiles(local, remote.profile) : { ...defaultProfile(kidId), ...remote.profile, since: { xp: 0, gems: 0, days: {} } };
    merged.syncedAt = remote.updatedAt; merged.updatedAt = localChanged ? Date.now() : remote.updatedAt; merged._lx = merged.xp; merged._lg = merged.gems;

/* ========= Familjekonfiguration (privat) =========
   Allt som är specifikt för EN familj – barnens namn, vilken kursmall de följer, tema, prov, skolans glosor,
   lärarens kommentar – ligger här, inte i den publika koden. Konfigurationen sparas som dokumentet `_config`
   i familjens egen molnlagring och cachas lokalt så att appen fungerar offline.
   Form:
   { v: 1, updatedAt: <ms>, kids: [ { id, name, template: 'ak8'|'ak4'|'ak2', theme: 'teen'|'sport'|'pet', hue, emoji, paper,
       exams: [{ id, title, date, skillIds, deckIds }], decks: [{ id, lang, name, emoji, level, words: [[w, t, e], …] }],

const FAMILY = {
  KEY: 'pluggappen.family.v1',

  saveLocal() { try { if (FAMILY.cfg) localStorage.setItem(FAMILY.KEY, JSON.stringify(FAMILY.cfg)); else localStorage.removeItem(FAMILY.KEY); } catch (e) { /* ignore */ } },
  valid(c) {

    return c.kids.every(k => k && typeof k.id === 'string' && /^[a-z0-9_-]{1,24}$/.test(k.id) && typeof k.name === 'string' && k.name.trim().length >= 1 && k.name.length <= 30 && TEMPLATES[k.template]);
  },
  // Normalise + fill defaults; strips unknown keys so the config can never carry executable content.
  clean(c) {
    const str = (v, max) => (typeof v === 'string' ? v.replace(/[<>]/g, '').slice(0, max) : '');
    return { v: 1, updatedAt: Number(c.updatedAt) || Date.now(), appName: str(c.appName, 40) || undefined, kids: c.kids.map(k => ({
      id: k.id, name: str(k.name, 30).trim(), template: k.template, theme: ['teen', 'sport', 'pet'].includes(k.theme) ? k.theme : 'pet',
      hue: ['teal', 'orange', 'pink', 'slate', 'blaugrana', 'rod'].includes(k.hue) ? k.hue : 'teal', emoji: str(k.emoji, 4) || '🙂', paper: str(k.paper, 20) || null,
      exams: (Array.isArray(k.exams) ? k.exams : []).map(e => ({ id: str(e.id, 40), title: str(e.title, 60), date: str(e.date, 10), skillIds: (e.skillIds || []).filter(x => typeof x === 'string').slice(0, 60), deckIds: (e.deckIds || []).filter(x => typeof x === 'string').slice(0, 30) })).filter(e => e.id && e.title && /^\d{4}-\d{2}-\d{2}$/.test(e.date)),
      decks: (Array.isArray(k.decks) ? k.decks : []).map(d => ({ id: str(d.id, 40), lang: ['en', 'es', 'sv', 'de', 'fr'].includes(d.lang) ? d.lang : 'en', name: str(d.name, 60), emoji: str(d.emoji, 4) || '📘', level: [1, 2, 3].includes(d.level) ? d.level : 2, words: (Array.isArray(d.words) ? d.words : []).slice(0, 200).map(w => [str(w[0], 60), str(w[1], 60), str(w[2], 4)]).filter(w => w[0] && w[1]) })).filter(d => d.id && d.name && d.words.length),
      note: k.note && typeof k.note === 'object' ? { title: str(k.note.title, 60), lines: (Array.isArray(k.note.lines) ? k.note.lines : []).slice(0, 12).map(l => str(l, 200)).filter(Boolean) } : null,
    })) };
  },
  apply(c) { FAMILY.cfg = FAMILY.clean(c); FAMILY.saveLocal(); buildKids(); try { document.title = (FAMILY.cfg.appName || 'Pluggapp'); } catch (e) { /* no DOM */ } },
  async pull() {
    if (!SYNC.active) return false;
    try {
      const r = await SYNC.fetch(SYNC.url('_config'), { cache: 'no-store' }); if (!r.ok) return false;
      const doc = await r.json(); const remote = JSON.parse(doc.fields?.json?.stringValue || 'null');

  },
  async push() {
    if (!SYNC.active || !FAMILY.cfg) return false;

    try { const r = await SYNC.fetch(SYNC.url('_config'), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); return r.ok; } catch (e) { return false; }
  },
  // Parent: import a config JSON (pasted). Returns { ok, msg }.
  async importJson(text) {

    if (!FAMILY.valid(c)) return { ok: false, msg: 'Konfigurationen saknar barn, eller har ett okänt mall-id (ak8, ak4, ak2).' };

  exportJson() { return JSON.stringify(FAMILY.cfg, null, 2); },

// Bygger KIDS (det appen jobbar med) av mall + familjekonfiguration. Idempotent.

// Standardvärden per barn: mallens inställningar + familjens prov och glosor.
const kidDefaults = (kidId) => { const k = KIDS.find(x => x.id === kidId); if (!k) return null; const tpl = TEMPLATES[k.template]; return { settings: { ...tpl.defaults }, decks: [...tpl.decks, ...k.cfgDecks.map(d => d.id)], exams: k.cfgExams.map(e => ({ ...e, skillIds: [...e.skillIds], deckIds: [...e.deckIds] })), paper: k.paper || 'rutat' }; };

/* ========= Enhetsidentitet och familjemedlemskap =========
   Varje enhet loggar in anonymt i Firebase (ingen e-post, inget lösenord) och får ett stabilt uid.
   En familj har   meta/info      { joinCode, createdAt, rotatedAt }
                   members/{uid}  { role: 'kid'|'parent', device, joinedAt, lastSeen, code }
   Parkoppling = enheten visar upp familjens aktuella parkopplingskod EN gång och blir medlem.
   Därefter styr Firestore-reglerna: bara medlemmar läser/skriver familjens profiler. Koden sparas inte på enheten.
   Föräldern kan byta kod (gamla länkar slutar fungera för NYA enheter) och ta bort enheter.
   Övergång: en enhet med gammal familjekod startar familjen med joinCode = den gamla koden och går med automatiskt. */
const AUTH = {
  KEY: 'pluggappen.auth.v1',

  denied: false,
  get ready() { return !!(SYNC.cfg && AUTH.st && AUTH.st.idToken); },
  get uid() { return AUTH.st ? AUTH.st.uid : null; },
  load() { try { const raw = localStorage.getItem(AUTH.KEY); if (raw) AUTH.st = JSON.parse(raw); } catch (e) { /* ignore */ } },
  save() { try { if (AUTH.st) localStorage.setItem(AUTH.KEY, JSON.stringify(AUTH.st)); else localStorage.removeItem(AUTH.KEY); } catch (e) { /* ignore */ } },
  async signIn() {

      const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${SYNC.cfg.apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true }) });

  async ensureToken() {

      const j = await r.json(); AUTH.st = { uid: j.user_id, idToken: j.id_token, refreshToken: j.refresh_token, exp: Date.now() + (Number(j.expires_in) - 60) * 1000 }; AUTH.save(); return true;

  async fetch(url, opts = {}) {

  },
  // ---- familj / medlemskap ----
  base() { return `https://firestore.googleapis.com/v1/projects/${SYNC.cfg.projectId}/databases/(default)/documents/families/${encodeURIComponent(SYNC.family)}`; },
  doc(path) { return `${AUTH.base()}/${path}?key=${SYNC.cfg.apiKey}`; },
  deviceLabel() { const ua = navigator.userAgent; const dev = /iPad/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document) ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android' : 'Dator'; return `${dev}${window.navigator.standalone || matchMedia('(display-mode: standalone)').matches ? ' · hemskärm' : ' · webbläsare'}`; },
  get member() { return DB.settings.member && DB.settings.member.fam === SYNC.family ? DB.settings.member : null; },
  newCode() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const buf = new Uint32Array(16); crypto.getRandomValues(buf); for (const n of buf) s += a[n % a.length]; return s.slice(0, 4) + '-' + s.slice(4, 8) + '-' + s.slice(8, 12) + '-' + s.slice(12, 16); },
  // Gå med i familjen med en parkopplingskod. role: 'kid' | 'parent'. Returnerar { ok, msg }.
  async join(code, role) {
    if (!SYNC.active) return { ok: false, msg: 'Ingen familj vald.' };
    if (!(await AUTH.signIn())) return { ok: false, msg: 'Kunde inte skapa enhetsidentitet (nät?).' };
    const uid = AUTH.uid; const fields = (o) => ({ fields: Object.fromEntries(Object.entries(o).map(([k, v]) => [k, typeof v === 'number' ? { integerValue: String(v) } : { stringValue: String(v) }])) });
    // redan medlem?
    try { const r = await AUTH.fetch(AUTH.doc('members/' + uid)); if (r.ok) { DB.settings.member = { fam: SYNC.family, uid, role: (await r.json()).fields?.role?.stringValue || role, joinedAt: Date.now() }; save(); return { ok: true, msg: 'Enheten är redan parkopplad.' }; } } catch (e) { /* fortsätt */ }
    code = (code || '').trim();
    if (!code) return { ok: false, msg: 'Parkopplingskod saknas.' };

    // create tillåts bara om meta/info saknas (reglerna), annars 403 → familjen finns redan och koden prövas nedan.
    try { await AUTH.fetch(AUTH.doc('meta/info'), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fields({ joinCode: code, createdAt: Date.now() })) }); } catch (e) { return { ok: false, msg: 'Nätverksfel.' }; }
    const r2 = await AUTH.fetch(AUTH.doc('members/' + uid), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fields({ role, device: AUTH.deviceLabel().slice(0, 60), joinedAt: Date.now(), lastSeen: Date.now(), code })) });
    if (!r2.ok) return { ok: false, msg: r2.status === 403 ? 'Fel parkopplingskod – eller så har föräldern bytt kod.' : 'Kunde inte parkoppla (' + r2.status + ').' };

  async listMembers() {

  },
  async removeMember(uid) { try { const r = await AUTH.fetch(AUTH.doc('members/' + uid), { method: 'DELETE' }); return r.ok; } catch (e) { return false; } },
  async setRole(uid, role) { try { const r = await AUTH.fetch(AUTH.doc('members/' + uid) + '&updateMask.fieldPaths=role', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: { role: { stringValue: role } } }) }); if (r.ok && uid === AUTH.uid && DB.settings.member) { DB.settings.member.role = role; save(); } return r.ok; } catch (e) { return false; } },
  async getJoinCode() { try { const r = await AUTH.fetch(AUTH.doc('meta/info')); if (!r.ok) return null; return (await r.json()).fields?.joinCode?.stringValue || null; } catch (e) { return null; } },
  async rotateCode() { const code = AUTH.newCode(); try { const r = await AUTH.fetch(AUTH.doc('meta/info') + '&updateMask.fieldPaths=joinCode&updateMask.fieldPaths=rotatedAt', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: { joinCode: { stringValue: code }, rotatedAt: { integerValue: String(Date.now()) } } }) }); return r.ok ? code : null; } catch (e) { return null; } },
  pairLink(code) { return location.origin + location.pathname + '#fam-' + SYNC.family + (code ? '.' + code : ''); },
  // Tolka en parkopplingssträng: "familj.kod" eller gammal "familjekod" (då är koden = familjen).
  parsePair(str) { const s = (str || '').trim().replace(/[^a-zA-Z0-9\-.]/g, ''); if (!s) return null; const i = s.indexOf('.'); return i > 0 ? { fam: s.slice(0, i), code: s.slice(i + 1) } : { fam: s, code: s }; },
};

/* ========= Push reminders (self-hosted build only; needs service worker + VAPID public key + sync) ========= */
const PUSH = {
  key: typeof window !== 'undefined' ? window.PLUGG_PUSH_KEY || null : null,
  supported() { return !!(PUSH.key && typeof navigator !== 'undefined' && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window); },
  needsInstall() { return typeof navigator !== 'undefined' && /iPhone|iPad/.test(navigator.userAgent) && !(window.navigator.standalone || matchMedia('(display-mode: standalone)').matches); },
  current() { return DB.settings.push || null; },
  lastStatus: null,
  async loadStatus() { if (!SYNC.active) return; try { const r = await SYNC.fetch(SYNC.url('push_log'), { cache: 'no-store' }); if (!r.ok) return; const doc = await r.json(); PUSH.lastStatus = JSON.parse(doc.fields?.json?.stringValue || 'null'); } catch (e) { /* ignore */ } },
  urlB64(b64) { const pad = '='.repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); },
  async enable(kidId) {
    if (!PUSH.supported() || !SYNC.active) return { ok: false, msg: 'Påminnelser kräver att synk är på och att appen ligger på hemskärmen.' };

      const perm = await Notification.requestPermission(); if (perm !== 'granted') return { ok: false, msg: 'Du sa nej till notiser. Ändra under Inställningar → Notiser om du ångrar dig.' };

      const id = 'push_' + btoa(sub.endpoint).replace(/[^a-zA-Z0-9]/g, '').slice(-24);
      const body = { fields: { json: { stringValue: JSON.stringify({ sub: sub.toJSON(), kid: kidId, device: navigator.userAgent.slice(0, 80), createdAt: Date.now() }) }, updatedAt: { integerValue: String(Date.now()) }, kid: { stringValue: kidId } } };
      const r = await SYNC.fetch(SYNC.url(id), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      DB.settings.push = { id, kid: kidId }; try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { /* ignore */ }
      return { ok: true };
    } catch (e) { return { ok: false, msg: 'Det gick inte att slå på: ' + e.message }; }
  },
  async disable() {
    const cur = PUSH.current(); if (!cur) return;
    try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) { /* ignore */ }
    try { await SYNC.fetch(SYNC.url(cur.id), { method: 'DELETE' }); } catch (e) { /* ignore */ }
    DB.settings.push = null; try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { /* ignore */ }

function buy(kid, id) {
  const p = prof(kid.id);
  if (id === 'paper_rutat') { p.paper = 'rutat'; save(); applyLook(kid); return VIEWS.shop(); }
  if (id === 'acc_default') { p.accent = null; save(); applyLook(kid); return VIEWS.shop(); }
  if (id === 'font_toggle') { p.settings.font = p.settings.font === 'lexend' ? 'standard' : 'lexend'; save(); applyLook(kid); return VIEWS.shop(); }
  if (id === 'size_toggle') { p.settings.textsize = p.settings.textsize === 'large' ? 'normal' : 'large'; save(); applyLook(kid); return VIEWS.shop(); }
  if (id.startsWith('theme_')) { p.settings.dark = id === 'theme_dark' ? true : id === 'theme_light' ? false : null; save(); applyLook(kid); return VIEWS.shop(); }
  const base = PETS.find(x => !x.shop && 'pet_' + x.id === id); if (base) { p.pet = base.id; save(); toast(`${base.name} följer med dig nu`); return VIEWS.shop(); }
  const it = SHOP.find(x => x.id === id); if (!it) return;

async function deleteKidData(kidId) {
  const now = Date.now(); const fresh = { ...defaultProfile(kidId), resetAt: now, updatedAt: now, syncedAt: now }; fresh._lx = 0; fresh._lg = 0;
  DB.profiles[kidId] = fresh; try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { /* ignore */ }
  if (!SYNC.active) return false;
  try { const body = { fields: { json: { stringValue: JSON.stringify(fresh) }, updatedAt: { integerValue: String(now) }, kid: { stringValue: kidId } } }; const r = await SYNC.fetch(SYNC.url(kidId), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); return r.ok; } catch (e) { return false; }
}
