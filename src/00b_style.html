<style>
/* ---- Paper themes (unlockable) ---- */
:root[data-paper="prickar"] body { background-image: radial-gradient(var(--grid) 1.6px, transparent 1.6px); background-size: 22px 22px; }
:root[data-paper="linjer"] body { background-image: linear-gradient(var(--grid) 1px, transparent 1px); background-size: 100% 30px; }
:root[data-paper="rymd"] body { background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,.35) 1px, transparent 1.6px), radial-gradient(circle at 70% 60%, rgba(255,255,255,.3) 1px, transparent 1.6px), radial-gradient(circle at 45% 85%, rgba(255,255,255,.25) 1px, transparent 1.6px); background-size: 160px 160px, 220px 220px, 190px 190px; --paper: #171b33; --grid: rgba(255,255,255,.1); --ink: #eef1f7; --muted: #aab3c9; --card: #222845; --line: #343c60; --soft: #2a3152; color-scheme: dark; }
:root[data-paper="hav"] body { background-image: repeating-linear-gradient(0deg, transparent 0 18px, var(--grid) 18px 19px), repeating-linear-gradient(90deg, transparent 0 64px, var(--grid) 64px 65px); --paper: #eaf6fb; --grid: rgba(20,110,160,.12); }
:root[data-paper="skog"] body { --paper: #f1f6ec; --grid: rgba(60,120,60,.14); }
:root[data-paper="blank"] body { background-image: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"])[data-paper="hav"] body { --paper: #0f2430; --grid: rgba(120,200,240,.1); } :root:not([data-theme="light"])[data-paper="skog"] body { --paper: #14211a; --grid: rgba(140,220,140,.1); } }
:root[data-theme="dark"][data-paper="hav"] body { --paper: #0f2430; --grid: rgba(120,200,240,.1); } :root[data-theme="dark"][data-paper="skog"] body { --paper: #14211a; --grid: rgba(140,220,140,.1); }

/* ---- Sport theme (hockey) ---- */
[data-hue="rod"] { --acc: #c8202a; --acc-soft: #fbe0e1; --acc-ink: #7d1016; --acc-glow: rgba(200,32,42,.28); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) [data-hue="rod"], :root:not([data-theme="light"])[data-hue="rod"] { --acc: #ef5a62; --acc-soft: #3f1719; --acc-ink: #ffd4d6; --acc-glow: rgba(239,90,98,.3); } }
:root[data-theme="dark"] [data-hue="rod"], :root[data-theme="dark"][data-hue="rod"] { --acc: #ef5a62; --acc-soft: #3f1719; --acc-ink: #ffd4d6; --acc-glow: rgba(239,90,98,.3); }
[data-hue="blaugrana"] { --acc: #a50044; --acc-soft: #f6dbe5; --acc-ink: #6d0030; --acc-glow: rgba(165,0,68,.28); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) [data-hue="blaugrana"], :root:not([data-theme="light"])[data-hue="blaugrana"] { --acc: #e04a84; --acc-soft: #3d1426; --acc-ink: #ffd0e0; --acc-glow: rgba(224,74,132,.3); } }
:root[data-theme="dark"] [data-hue="blaugrana"], :root[data-theme="dark"][data-hue="blaugrana"] { --acc: #e04a84; --acc-soft: #3d1426; --acc-ink: #ffd0e0; --acc-glow: rgba(224,74,132,.3); }
:root[data-paper="barca"] body { background-image: repeating-linear-gradient(90deg, rgba(165,0,68,.07) 0 28px, rgba(0,77,152,.07) 28px 56px); background-size: auto; }
:root[data-paper="lulea"] body { background-image: repeating-linear-gradient(0deg, transparent 0 46px, rgba(216,35,42,.12) 46px 48px), repeating-linear-gradient(90deg, transparent 0 46px, rgba(20,30,60,.05) 46px 47px); background-size: auto; }
.player-card { position: relative; overflow: hidden; border-radius: 20px; padding: 16px 18px; color: #fff; background: linear-gradient(135deg, #d8232a 0%, #8e1016 55%, #1a1f2b 100%); box-shadow: var(--shadow); display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; min-height: 120px; }
.player-card::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 34px, rgba(255,255,255,.08) 34px 36px), radial-gradient(circle at 85% 50%, rgba(255,255,255,.1) 0 38px, transparent 40px); pointer-events: none; }
.player-card.lulea { background: linear-gradient(135deg, #d8232a 0%, #8e1016 55%, #1a1f2b 100%); }
.player-card .rating { font-family: var(--display); font-weight: 800; font-size: 3rem; line-height: 1; letter-spacing: -.04em; text-align: center; }
.player-card .pos { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; opacity: .8; text-align: center; margin-top: 2px; }
.player-card .pname { font-family: var(--display); font-weight: 800; font-size: 1.4rem; letter-spacing: .02em; text-transform: uppercase; }
.player-card .ptitle { opacity: .85; font-size: .95rem; }
.player-card .pstats { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
.player-card .pstats div { font-size: .8rem; opacity: .9; } .player-card .pstats b { display: block; font-family: var(--display); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.player-card .xpbar { background: rgba(255,255,255,.22); margin-top: 8px; } .player-card .xpbar > i { background: #fff; }

/* ---- Companion ---- */
.hero { display: grid; grid-template-columns: 80px 1fr; gap: 14px; align-items: center; }
.pet { width: 80px; height: 80px; border-radius: 24px; background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--acc-soft) 70%, white), var(--acc-soft)); display: grid; place-items: center; font-size: 2.6rem; position: relative; }
.pet.bounce { animation: none; }
@keyframes bounce { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-5px);} }
.pet .lvl { position: absolute; right: -6px; bottom: -6px; background: var(--ink); color: var(--paper); font-family: var(--display); font-weight: 800; font-size: .8rem; min-width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; padding: 0 6px; border: 3px solid var(--card); }
.rank { width: 80px; height: 80px; border-radius: 24px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 2rem; letter-spacing: -.04em; position: relative; }
.rank small { position: absolute; bottom: 8px; font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.mood { font-size: .95rem; color: var(--muted); }
.go-btn { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; width: 100%; min-height: 72px; padding: 14px 20px; border-radius: 18px; background: var(--acc); color: #fff; text-align: left; box-shadow: 0 8px 24px -10px var(--acc-glow), 0 1px 2px rgba(0,0,0,.12); transition: transform .08s ease, filter .12s ease; }
.go-btn:hover { filter: brightness(1.05); } .go-btn:active { transform: scale(.985); }
.go-btn .t { font-family: var(--display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; letter-spacing: -.02em; }
.go-btn .s { opacity: .9; font-size: .95rem; margin-top: 2px; }
.go-btn .arrow { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.18); display: grid; place-items: center; } .go-btn .arrow svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.quest { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.quest:first-of-type { border-top: 0; }
.quest .qi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 1.3rem; background: var(--soft); }
.quest.done .qi { background: var(--good-soft); }
.quest .qt { font-weight: 700; font-size: .98rem; }
.quest .qp { font-size: .82rem; color: var(--muted); }
.quest .claim { background: var(--good); color: #fff; box-shadow: none; min-height: 38px; padding: 0 14px; font-size: .92rem; }
.gem { color: #5a7bff; font-weight: 800; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.section-h a, .section-h button.link { color: var(--acc-ink); font-weight: 700; font-size: .9rem; text-decoration: underline; text-underline-offset: 3px; }
.deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.deck { display: grid; gap: 8px; padding: 14px; text-align: left; position: relative; }
.deck .de { font-size: 2rem; line-height: 1; }
.deck .dn { font-family: var(--display); font-weight: 800; font-size: 1.05rem; line-height: 1.15; }
.deck .dm { font-size: .82rem; color: var(--muted); }
.deck .flag { position: absolute; top: 10px; right: 12px; font-size: 1.1rem; }
.deck.locked { opacity: .55; }
.ring.sm { width: 44px; height: 44px; } .ring.sm::after { inset: 5px; } .ring.sm b { font-size: .8rem; }

/* ---- Word exercises ---- */
.word-card { text-align: center; display: grid; gap: 10px; justify-items: center; }
.word-card .we { font-size: 4.5rem; line-height: 1; }
.word-card .ww { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1.1; }
.word-card .wt { font-size: 1.2rem; color: var(--muted); }
.speak-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; min-width: 50px; padding: 0 16px; border-radius: 14px; background: var(--acc-soft); color: var(--acc-ink); font-family: var(--display); font-weight: 700; font-size: 1.1rem; }
.speak-btn.big { min-height: 96px; min-width: 96px; padding: 0; border-radius: 28px; } .speak-btn.big svg { width: 40px; height: 40px; }
.speak-btn:active { transform: scale(.96); }
.wchoices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wchoice { min-height: 68px; padding: 10px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line); font-family: var(--display); font-weight: 800; font-size: 1.15rem; box-shadow: var(--shadow); display: grid; place-items: center; gap: 4px; text-align: center; line-height: 1.15; }
.wchoice .ce { font-size: 1.8rem; line-height: 1; }
.wchoice.ok { border-color: var(--good); background: var(--good-soft); } .wchoice.no { border-color: var(--bad); background: var(--bad-soft); }
.wchoice:disabled { opacity: .85; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match-col { display: grid; gap: 8px; }
.mtile { min-height: 56px; padding: 8px 10px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); font-family: var(--display); font-weight: 700; font-size: 1.05rem; box-shadow: var(--shadow); line-height: 1.15; }
.mtile.sel { border-color: var(--acc); background: var(--acc-soft); }
.mtile.done { opacity: .35; border-color: var(--good); background: var(--good-soft); pointer-events: none; }
.mtile.no { animation: shake .4s ease; border-color: var(--bad); }
.slots { min-height: 60px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 10px; border: 2px dashed var(--line); border-radius: 14px; }
.slots .ltile { background: var(--acc-soft); color: var(--acc-ink); }
.ltiles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.ltile { width: 44px; height: 50px; border-radius: 10px; background: var(--card); border: 1.5px solid var(--line); font-family: var(--display); font-weight: 800; font-size: 1.4rem; box-shadow: var(--shadow); display: grid; place-items: center; }
.ltile.used { visibility: hidden; }
.ltile.space { width: 24px; border: 0; background: transparent; box-shadow: none; }
.prompt-row { display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--display); font-weight: 800; font-size: 1.5rem; text-align: center; }
.prompt-row .pe { font-size: 2.4rem; line-height: 1; }

/* ---- Figures ---- */
.figwrap { display: flex; justify-content: center; padding: 4px 0; } .figwrap svg { max-width: 100%; height: auto; }

/* ---- Ordering ---- */
.order-pool { display: grid; gap: 8px; }
.otile { text-align: left; padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); box-shadow: var(--shadow); font-size: .98rem; line-height: 1.3; }
.otile.used { display: none; }
.order-slots { display: grid; gap: 6px; justify-content: stretch; }
.order-slots .otile.picked { background: var(--acc-soft); border-color: var(--acc); display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; }
.otile .onum { width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: .85rem; }
.order-slots .otile.ok { border-color: var(--good); background: var(--good-soft); } .order-slots .otile.no { border-color: var(--bad); background: var(--bad-soft); }

/* ---- Sketch pad ---- */
.sketch summary { cursor: pointer; color: var(--muted); font-weight: 700; font-size: .95rem; list-style: none; }
.sketch summary::-webkit-details-marker { display: none; }
.sketch-wrap { margin-top: 8px; }
.sketch canvas { width: 100%; height: auto; border: 1.5px dashed var(--line); border-radius: 12px; background: var(--paper); touch-action: none; display: block; }

/* ---- Read-aloud highlight, mic ---- */
.question .w.hl { background: var(--warn-soft); border-radius: 4px; box-shadow: 0 0 0 2px var(--warn-soft); }
.speak-btn.listening { animation: pulse 1s ease-in-out infinite; } @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.08);} }

/* ---- Readability ---- */
:root[data-font="lexend"] body, :root[data-font="lexend"] .m, :root[data-font="lexend"] h1, :root[data-font="lexend"] h2, :root[data-font="lexend"] h3, :root[data-font="lexend"] .btn { font-family: "Lexend", var(--body); }
:root[data-size="large"] body { font-size: 19px; } :root[data-size="large"] .question { font-size: 1.4rem; }

/* ---- Focus mode ---- */
.focus .topbar .pill, .focus .lvl-dots { display: none; }
.focus .question { font-size: 1.4rem; }
.focus .question .m { font-size: 1.7rem; }
.left-count { font-family: var(--display); font-weight: 800; color: var(--acc-ink); }
.break-card { text-align: center; display: grid; gap: 14px; justify-items: center; }
.break-card .big { font-family: var(--display); font-size: 3.4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.break-ideas { display: grid; gap: 6px; text-align: left; width: 100%; }
.break-ideas div { background: var(--soft); border-radius: 10px; padding: 8px 12px; }

/* ---- Blitz ---- */
.blitz-bar { height: 12px; border-radius: 99px; background: var(--soft); overflow: hidden; } .blitz-bar > i { display: block; height: 100%; background: var(--warn); transition: width 1s linear; }
.blitz-score { font-family: var(--display); font-weight: 800; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; text-align: center; }

/* ---- Shop ---- */
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.shop-item { display: grid; gap: 6px; padding: 12px; text-align: center; justify-items: center; }
.shop-item .se { font-size: 2.4rem; line-height: 1; }
.shop-item .sn { font-weight: 700; font-size: .95rem; }
.shop-item .sp { font-size: .85rem; }
.shop-item.owned { outline: 2px solid var(--acc); outline-offset: -2px; }
.swatch { width: 44px; height: 44px; border-radius: 14px; }

/* ---- Pet picker ---- */
.pet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.pet-opt { display: grid; gap: 6px; padding: 16px; text-align: center; justify-items: center; }
.pet-opt .pe { font-size: 3.2rem; line-height: 1; }
.pet-opt .pn { font-family: var(--display); font-weight: 800; }

/* ---- Exam plan ---- */
.plan-day { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.plan-day:first-of-type { border-top: 0; }
.plan-day .d { font-family: var(--display); font-weight: 800; font-size: .95rem; text-align: center; background: var(--soft); border-radius: 10px; padding: 4px 0; }
.plan-day.today .d { background: var(--acc); color: #fff; }

/* ---- Parent forms ---- */
.field { display: grid; gap: 4px; } .field label { font-size: .85rem; font-weight: 700; color: var(--muted); }
.field input, .field select { min-height: 46px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--paper); font-size: 1rem; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px; border: 1.5px solid var(--line); font-weight: 700; font-size: .9rem; cursor: pointer; }
.check.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-ink); }
.check input { display: none; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.toggle:first-of-type { border-top: 0; }
.toggle .tl { font-weight: 700; } .toggle .td { font-size: .85rem; color: var(--muted); }
.switch { width: 54px; height: 32px; border-radius: 999px; background: var(--line); position: relative; flex-shrink: 0; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch.on { background: var(--acc); } .switch.on::after { left: 25px; }
.seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; }
.seg button { min-height: 34px; padding: 0 12px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.wordlist { display: grid; gap: 4px; font-size: .92rem; } .wordlist div { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); }
.boxes { display: inline-flex; gap: 2px; } .boxes i { width: 8px; height: 8px; border-radius: 2px; background: var(--line); } .boxes i.on { background: var(--good); }
.danger { color: var(--bad); border-color: var(--bad) !important; }
.week { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
/* ämnesflikar */
.subject-wrap { display: flex; flex-direction: column; gap: 10px; min-width: 0; max-width: 100%; } .subject-wrap > * { min-width: 0; max-width: 100%; }
.subj-tabs { display: grid; width: 100%; grid-auto-flow: column; grid-auto-columns: minmax(84px, 1fr); gap: 8px; overflow-x: auto; padding: 4px 2px 6px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.subj-tabs::-webkit-scrollbar { display: none; }
.subj { scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px 8px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); color: var(--ink); font-weight: 700; font-size: .85rem; min-height: 78px; transition: transform .12s ease, border-color .12s ease, background .12s ease; }
.subj .si { font-size: 1.5rem; line-height: 1; }
.subj .sl { white-space: nowrap; }
.subj .sp { width: 100%; height: 4px; border-radius: 2px; background: var(--soft); overflow: hidden; margin-top: 2px; } .subj .sp i { display: block; height: 100%; background: var(--acc); border-radius: 2px; }
.subj.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-ink); transform: translateY(-1px); }
.subj:active { transform: scale(.97); }
.focus .subj .sp { display: none; }
/* svenska: lyssna-ruta och lästext */
.listen-box { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 0 2px; }
.listen-box .speak-btn.big { min-width: 64px; min-height: 64px; font-size: 1.6rem; border-radius: 20px; }
.readbox { text-align: left; background: var(--soft); border-radius: 14px; padding: 12px 14px; font-size: 1.02rem; line-height: 1.55; width: 100%; }
.readbox p { margin: 6px 0 0; }

/* ===== Experience v3 – uppdraget först, aktiviteter, KLAR → FLOW. Samma färger och typsnitt (barnets egen accentfärg). ===== */
.mission { border: 2px solid var(--acc); gap: 10px; }
.mission .eyebrow { color: var(--acc-ink); letter-spacing: .08em; font-weight: 800; }
.mission-title { font-family: var(--display); font-weight: 800; font-size: 1.45rem; line-height: 1.2; }
.mission.explore .mission-title { font-size: 1.6rem; }
.mission.done { text-align: center; align-items: center; border-color: var(--good); }
.mission.done .mission-icon { font-size: 2rem; }
.mission-sub { font-size: 1.05rem; }
.v3go { min-height: 76px; }
.v3go .t { font-size: 1.5rem; letter-spacing: .06em; }
.stations { display: flex; flex-wrap: wrap; gap: 8px; }
.station { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 12px; border-radius: 999px; background: var(--acc-soft); color: var(--acc-ink); font-weight: 700; font-size: .95rem; }
.progress-states { display: flex; gap: 14px; flex-wrap: wrap; font-size: .95rem; }
.progress-states b { font-family: var(--display); font-size: 1.15rem; color: var(--acc-ink); }
.goal-title { font-family: var(--display); font-weight: 800; font-size: 1.7rem; letter-spacing: .02em; line-height: 1.1; }
.goal-date { font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.train ul { margin: 6px 0 0; padding-left: 20px; font-size: 1.05rem; font-weight: 600; }
.train li { margin: 2px 0; }
.then { font-size: .95rem; color: var(--muted); }
.goal-detail summary, .quests-fold > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; }
.quests-fold .card { box-shadow: none; border: 0; padding: 0; background: transparent; }
.welcome { border: 2px solid var(--acc); }
/* Aktiviteter – allt med tryck, inga dragningar. Tryckytor minst 48 px. */
.sortbox { display: grid; gap: 12px; }
.sort-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 52px; }
.sort-pool.empty { display: none; }
.stile:focus-visible, .sbin-h:focus-visible, .tapword:focus-visible, .mtile:focus-visible, .station:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.stile { min-height: 52px; min-width: 64px; padding: 8px 14px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); box-shadow: var(--shadow); font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
.stile.sel { border-color: var(--acc); background: var(--acc-soft); outline: 3px solid var(--acc-glow); }
.stile.placed { min-height: 44px; font-size: .95rem; box-shadow: none; }
.stile.ok { border-color: var(--good); background: var(--good-soft); }
.stile.no { border-color: var(--bad); background: var(--bad-soft); }
.sort-bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.sbin { min-height: 96px; padding: 10px; border-radius: 16px; border: 2px dashed var(--acc); background: color-mix(in srgb, var(--acc-soft) 45%, var(--card)); display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: center; cursor: pointer; }
.sbin-h { min-height: 48px; border-radius: 12px; background: transparent; font-family: var(--display); font-weight: 800; color: var(--acc-ink); font-size: 1.05rem; }
.sbin-items { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.tip { font-size: .9rem; text-align: center; margin: 0; }
.match-grid.v3 .mtile { min-height: 56px; }
.tapline { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 6px 0; }
.tapword { min-height: 52px; min-width: 48px; padding: 6px 14px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); box-shadow: var(--shadow); font-size: 1.2rem; font-weight: 700; }
.tapword.sel { border-color: var(--acc); background: var(--acc-soft); }
.tapword.ok { border-color: var(--good); background: var(--good-soft); }
.tapword.no { border-color: var(--bad); background: var(--bad-soft); }
.paper-note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--soft); border: 1.5px solid var(--line); font-size: 1rem; }
.paper-note > span { font-size: 1.4rem; line-height: 1; }
.selfcheck { padding: 10px 12px; border-radius: 14px; background: var(--soft); }
.selfcheck .btn.sc { min-height: 44px; }
.row.row-wrap { flex-wrap: wrap; }
.mission .link { min-height: 44px; }
.trail { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 2px 0; }
.trail .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: .9rem; background: var(--soft); border: 2px solid var(--line); color: var(--good); font-weight: 800; }
.trail .dot.ok { background: var(--good-soft); border-color: var(--good); }
.trail .dot.cur { border-color: var(--acc); background: var(--acc-soft); transform: scale(1.15); }
.trail.done .dot { width: 36px; height: 36px; font-size: 1.1rem; }
.klar-title { font-family: var(--display); font-weight: 800; font-size: 1.5rem; letter-spacing: .04em; }
.delight { font-weight: 700; color: var(--acc-ink); }
@media (max-width: 380px) { .sort-bins { grid-template-columns: 1fr 1fr; } .goal-title { font-size: 1.45rem; } }
/* v3 (UX-granskning): hopfällda kort visar att de går att öppna; neutral förloppsstapel (färdiga = mörka, aktuell = ring – aldrig rött/grönt) */
.goal-detail > summary::after, .quests-fold > summary::after, .more-fold > summary::after { content: '▾'; margin-left: auto; opacity: .6; }
.goal-detail[open] > summary::after, .quests-fold[open] > summary::after, .more-fold[open] > summary::after { content: '▴'; }
.progress.v3 i.done { background: var(--ink); opacity: .55; } .progress.v3 i.cur { background: var(--soft); box-shadow: inset 0 0 0 2px var(--ink); }
/* v3 tillgänglighet: "minska rörelse" stänger av studs, puls och övergångar */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* v3 tillgänglighet (kvalitetspasset): tryckytor minst 44 px för hopfällda rader, "Läs mer" och kladdytan; topbarens ikoner i v3-pass */
.more-fold > summary { min-height: 44px; display: flex; align-items: center; gap: 8px; }
body:has(.progress.v3, .trail, section.mission, .klar) .sketch > summary { min-height: 44px; display: flex; align-items: center; }
body:has(.progress.v3, .trail, section.mission, .klar) .icon-btn { width: 44px; height: 44px; }
.tm-bar { position: sticky; top: 0; z-index: 50; background: var(--warn-soft, #fff3d6); border-bottom: 2px solid var(--warn, #c98a00); }
.tm-bar .tm-in { max-width: 640px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 10px; align-items: center; font-size: .9rem; }
.tm-bar .btn { min-height: 44px; }
/* 3.2 visuell granskning (lågrisk, bara utseende): grönt betyder rätt, aldrig rött för framsteg; långa ord bryts i sorteringslådor;
   klara par syns tydligt; knapptexter radbryts jämnt; iPad får luftigare mål och uppdrag. */
.delight { color: var(--good); }
.progress-states b { color: var(--ink); }
.sbin { min-width: 0; }
.stile.placed { max-width: 100%; overflow-wrap: anywhere; hyphens: auto; }
.mtile.done { opacity: .7; }
.btn { text-wrap: balance; }
@media (min-width: 768px) { .goal-title { font-size: 2.1rem; } .mission-title { font-size: 1.9rem; } .v3go { min-height: 84px; } }
@media (max-height: 700px) { .paper-note { padding: 8px 12px; font-size: .95rem; } }
/* ===================== 3.3 World-Class Experience – bara utseende =====================
   Krokar: html[data-exp=explore|grow|achieve|classic] och #qcard[data-mode][data-role][data-exam]. Ingen logik. */
:root { --cta: var(--acc); --cta-glow: var(--acc-glow); --ease: cubic-bezier(.2, .8, .2, 1); --ink-2: #3c4558; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink-2: #c5cbd8; } } :root[data-theme="dark"] { --ink-2: #c5cbd8; }
.btn { background: var(--cta); }
.go-btn { background: var(--cta); box-shadow: 0 10px 26px -12px var(--cta-glow), 0 1px 2px rgba(0,0,0,.1); }
html { overflow-x: clip; }
.choice, .wchoice, .mtile, .stile, .tapword, .otile, .station .sl, .ltile { overflow-wrap: anywhere; hyphens: auto; min-width: 0; }
.tabs { overflow-x: auto; scrollbar-width: none; } .tabs::-webkit-scrollbar { display: none; } .tabs button { flex: 1 0 auto; padding: 0 12px; }

/* Startsidan: en sak i fokus – resten i en lugn lista */
.more-group { padding: 2px 16px; gap: 0; display: block; }
.more-group > * { border-top: 1px solid var(--line); }
.more-group > *:first-child { border-top: 0; }
.more-group > .card, .more-group > button.card { box-shadow: none; border-radius: 0; background: transparent; padding: 12px 0; width: 100%; border-left: 0; border-right: 0; border-bottom: 0; }
.more-group > *:first-child.card { border-top: 0; }
.more-group details > summary { min-height: 52px; }
.more-group .teacher-fold ul { padding-left: 18px; }

/* EXPLORE – ett äventyr man vill gå in i */
:root[data-exp="explore"] .mission.explore { position: relative; padding: 22px 20px 20px; gap: 14px; border: 0; background: linear-gradient(165deg, color-mix(in srgb, var(--acc-soft) 85%, var(--card)) 0%, var(--card) 70%); box-shadow: 0 18px 40px -26px var(--acc-glow), var(--shadow); }
.hero-pet { position: absolute; right: 14px; top: 8px; font-size: 3.4rem; line-height: 1; filter: drop-shadow(0 6px 10px rgba(20,30,60,.18)); animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
:root[data-exp="explore"] .mission.explore .mission-title { font-size: 1.85rem; letter-spacing: -.02em; max-width: calc(100% - 76px); }
:root[data-exp="explore"] .mission.explore > .muted { font-size: 1rem; }
:root[data-exp="explore"] .mission.explore .stations { gap: 12px 10px; justify-content: flex-start; }
:root[data-exp="explore"] .mission.explore .station { flex-direction: column; gap: 4px; min-height: 44px; padding: 0; background: transparent; color: var(--ink-2); font-size: .78rem; font-weight: 700; border-radius: 0; }
:root[data-exp="explore"] .mission.explore .station .si { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 1.4rem; background: var(--card); border: 2px solid color-mix(in srgb, var(--acc) 30%, var(--card)); box-shadow: 0 4px 12px -6px var(--acc-glow); }
:root[data-exp="explore"] .mission.explore .station.st-boss .si { border-color: var(--acc); background: color-mix(in srgb, var(--acc-soft) 60%, var(--card)); }
:root[data-exp="explore"] .mission.explore .v3go { min-height: 84px; }
:root[data-exp="explore"] .mission.explore .v3go .t { font-size: 1.6rem; }

/* GROW – framsteg man ser */
.grow-prog { display: grid; gap: 6px; }
.pbar3 { display: flex; gap: 2px; height: 8px; border-radius: 999px; overflow: hidden; background: var(--soft); }
.pbar3 i { display: block; min-width: 6px; }
:is(.pbar3, .progress-states) .p-skra { --pc: var(--good); } :is(.pbar3, .progress-states) .p-pvg { --pc: color-mix(in srgb, var(--good) 45%, var(--card)); } :is(.pbar3, .progress-states) .p-trnar { --pc: color-mix(in srgb, var(--ink) 22%, var(--card)); }
.pbar3 i { background: var(--pc); }
.progress-states .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--pc); margin-right: 6px; vertical-align: 1px; }
.progress-states .p-skra b { color: var(--good-ink, var(--good)); }
.grow-prog { display: grid; gap: 6px; } .grow-prog .gp-head { font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.goal-row { font-size: .95rem; color: var(--ink-2); line-height: 1.4; }

/* ACHIEVE – målet, idag, börja */
:root[data-exp="achieve"] .mission.achieve { padding: 22px 20px; gap: 10px; }
:root[data-exp="achieve"] .mission.achieve > .eyebrow { color: var(--muted); }
:root[data-exp="achieve"] .goal-title { font-size: 1.75rem; letter-spacing: .015em; }
:root[data-exp="achieve"] .goal-date { font-size: .95rem; color: var(--muted); font-weight: 700; letter-spacing: .03em; }
:root[data-exp="achieve"] .train { margin-top: 4px; }
:root[data-exp="achieve"] .train .eyebrow { color: var(--muted); }
:root[data-exp="achieve"] .train ul { list-style: none; padding: 0; margin-top: 6px; }
:root[data-exp="achieve"] .train li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 1.08rem; font-weight: 650; margin: 0; }
:root[data-exp="achieve"] .train li:first-child { border-top: 0; padding-top: 2px; }
:root[data-exp="achieve"] .mission.achieve .then { font-size: .92rem; }
:root[data-exp="achieve"] .act-chip, :root[data-exp="achieve"] #qcard .eyebrow { letter-spacing: .06em; }

/* Aktiviteten styr formen */
:root:not([data-exp="classic"]) #qcard { gap: 16px; }
:root:not([data-exp="classic"]) .answer-input { border-color: var(--line); }
:root:not([data-exp="classic"]) .answer-input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 10%, transparent); outline: none; }
:root:not([data-exp="classic"]) .act-chip.role-revansch { background: var(--warn-soft); color: #7a4f0e; }
:root:not([data-exp="classic"]) .act-chip.role-boss { background: color-mix(in srgb, var(--acc-soft) 70%, var(--card)); box-shadow: 0 0 0 1.5px var(--acc) inset; }
#qcard[data-role="boss"] { border: 2px solid color-mix(in srgb, var(--acc) 55%, var(--card)); box-shadow: 0 16px 36px -22px var(--acc-glow), var(--shadow); }
:root[data-exp="explore"] #qcard[data-role="boss"] { background: linear-gradient(180deg, color-mix(in srgb, var(--acc-soft) 45%, var(--card)) 0, var(--card) 140px); }
:root[data-exp="achieve"] #qcard[data-role="boss"] { border-color: var(--ink); border-width: 1.5px; }
#qcard[data-exam] { box-shadow: none; border: 1.5px solid var(--line); }
#qcard[data-role="revansch"] .sbin { border-color: var(--warn); background: color-mix(in srgb, var(--warn-soft) 55%, var(--card)); }
#qcard[data-role="revansch"] .sbin-h { color: #7a4f0e; }
/* Sortera: riktiga lådor; korten landar */
#qcard[data-mode="sort"] .sbin { border-style: solid; min-height: 116px; background: color-mix(in srgb, var(--acc-soft) 40%, var(--card)); }
#qcard[data-mode="sort"] .sort-pool .stile { box-shadow: 0 3px 0 color-mix(in srgb, var(--ink) 12%, transparent), var(--shadow); }
.stile.placed { animation: settle .26s var(--ease) both; }
@keyframes settle { from { transform: translateY(-10px) scale(1.08); opacity: .5; } to { transform: none; opacity: 1; } }
/* Para ihop: lika stora kort, klara par syns */
:root:not([data-exp="classic"]) .match-col { grid-auto-rows: 1fr; }
:root:not([data-exp="classic"]) .mtile.done { opacity: 1; background: var(--good-soft); border-color: var(--good); color: var(--ink); position: relative; }
:root:not([data-exp="classic"]) .mtile.done::after { content: '✓'; position: absolute; top: 4px; right: 8px; font-size: .85rem; color: var(--good); font-weight: 800; }
/* Ordna: en plats för varje steg */
#qcard[data-mode="order"] #orderSlots { min-height: 60px; padding: 10px; border: 2px dashed color-mix(in srgb, var(--ink) 18%, var(--line)); border-radius: 14px; background: var(--soft); }
#qcard[data-mode="order"] .order-pool .otile { font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
#qcard[data-mode="order"] .order-pool .otile::first-letter { text-transform: uppercase; }
/* Tryck: ordet i fokus */
#qcard[data-mode="tap"] .tapword { font-size: 1.35rem; min-height: 56px; }
/* Upptäck: något nytt, inte ännu en fråga */
.learn-ic { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; font-size: 2rem; background: color-mix(in srgb, var(--acc-soft) 80%, var(--card)); }
#qcard[data-mode="learn"] .learn-title { font-size: 1.55rem; }
#qcard[data-mode="learn"] p { font-size: 1.12rem; line-height: 1.5; }
/* Hitta felet: granska lösningarna */
.spot-sols { grid-template-columns: 1fr; gap: 10px; }
.wchoice.spot-sol { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 12px; align-items: start; text-align: left; place-items: start stretch; padding: 14px 14px 14px 12px; min-height: 0; font-family: var(--body); font-weight: 400; font-size: 1.05rem; line-height: 1.45; }
.spot-sol .sol-l { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--soft); font-family: var(--display); font-weight: 800; font-size: 1rem; color: var(--ink-2); }
.spot-sol .sol-b b { font-family: var(--display); font-weight: 800; }
.spot-sol .sol-b .m { font-size: 1.1rem; }
.wchoice.spot-sol.sel { box-shadow: 0 0 0 3px var(--acc-glow); border-color: var(--acc); }
.wchoice.spot-sol.no .sol-l { background: var(--bad); color: #fff; } .wchoice.spot-sol.ok .sol-l { background: var(--good); color: #fff; }
/* Baklänges: svaret vet vi – vad var uppgiften? */
.rev-target { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 16px; border-radius: 16px; background: var(--soft); border: 1.5px dashed color-mix(in srgb, var(--ink) 22%, var(--line)); text-align: center; }
.rev-k { font-size: .78rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.rev-v { font-family: var(--display); font-weight: 800; font-size: 1.9rem; letter-spacing: -.01em; }
.rev-q { font-size: .95rem; color: var(--ink-2); font-weight: 700; }
/* Papper: appen vet att det här görs bäst på papper */
#qcard[data-mode="paper"] .paper-note { background: color-mix(in srgb, var(--acc) 6%, var(--card)); border: 0; border-left: 4px solid var(--acc); border-radius: 4px 14px 14px 4px; padding: 14px 16px; font-size: 1.02rem; line-height: 1.5; }
#qcard[data-mode="paper"] .question { font-size: 1.3rem; }
#qcard[data-mode="paper"] .keys .key { min-height: 40px; font-size: 1.05rem; background: color-mix(in srgb, var(--soft) 70%, var(--card)); }

/* Återkoppling: en rad, rätt färg */
:root:not([data-exp="classic"]) #fb .feedback.no { background: var(--card); border: 1.5px solid var(--line); border-left: 4px solid var(--bad); color: var(--ink); }
:root:not([data-exp="classic"]) #fb .feedback.no .big { color: var(--ink); }
:root:not([data-exp="classic"]) #fb .feedback.ok { border-left: 4px solid var(--good); }
:root:not([data-exp="classic"]) #fb .hint { background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; color: var(--ink); font-weight: 600; }
#fb .steps.why { padding: 0; background: transparent; }
#fb .steps.why > summary { cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink-2); }
#fb .steps.why[open] { background: var(--soft); padding: 4px 14px 12px; }
:root[data-exp="grow"] .xp-pop { top: calc(env(safe-area-inset-top, 0px) + 84px); left: auto; right: max(16px, calc(50% - 300px)); transform: none; font-size: 1rem; padding: 4px 12px; border-radius: 999px; background: var(--good-soft); color: var(--good-ink); text-shadow: none; animation: xpchip .9s var(--ease) forwards; }
@keyframes xpchip { 0% { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }

/* Knapparna: Svara alltid nåbar, hjälpen lugnare */
:root:not([data-exp="classic"]) #actions:has(#next) { position: sticky; bottom: 0; z-index: 3; margin-inline: -8px; padding: 10px 8px max(10px, env(safe-area-inset-bottom, 0px)); background: var(--card); box-shadow: 0 -10px 14px -12px rgba(0,0,0,.18); }
:root:not([data-exp="classic"]) #hintBtn { padding: 0 14px; }
:root:not([data-exp="classic"]) #explainBtn { border: 0 !important; background: transparent; box-shadow: none; color: var(--ink-2); font-weight: 650; min-height: 44px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--ink) 30%, transparent); }

/* KLAR – ett riktigt slut */
.klar { text-align: center; align-items: center; padding: 28px 20px 24px; }
.klar .klar-icon { font-size: 3.4rem; line-height: 1; animation: klarIn .5s var(--ease) both; }
@keyframes klarIn { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.klar .klar-title { font-size: 1.6rem; }
.klar .klar-score { color: var(--muted); font-size: .95rem; font-weight: 650; }
.klar .klar-gems { font-weight: 700; }
.klar-achieve { text-align: left; align-items: flex-start; padding: 24px 22px; }
.klar-achieve .klar-title { font-size: 1.4rem; letter-spacing: .03em; }
.klar-achieve .klar-lead { font-size: 1.15rem; font-weight: 700; }
.klar-explore .trail.done .dot { width: 34px; height: 34px; font-size: 1.05rem; }

/* Testa mig – lugnt, resultat per mål */
.progress i.done { background: color-mix(in srgb, var(--ink) 55%, var(--card)); }
.exam-hero { text-align: left; }
.exam-hero .exam-head { font-family: var(--display); font-weight: 800; font-size: 1.35rem; line-height: 1.22; }
.exam-hero .exam-focus { font-size: 1.05rem; }
.exam-hero .exam-count { font-size: .9rem; }
.sdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin: 0 4px; }
.sdot.ok { background: var(--good); } .sdot.todo { background: var(--warn); }
:root:not([data-exp="classic"]) .exam-list details > summary { list-style: none; display: flex; align-items: center; gap: 4px; min-height: 40px; }
:root:not([data-exp="classic"]) .exam-list details > summary::-webkit-details-marker { display: none; }
:root:not([data-exp="classic"]) .exam-list details > summary::after { content: '▾'; margin-left: auto; opacity: .55; } :root:not([data-exp="classic"]) .exam-list details[open] > summary::after { content: '▴'; }

/* iPad: utformat för ytan, inte en utdragen telefon */
@media (min-width: 768px) {
  :root:not([data-exp="classic"]) .wrap { max-width: 760px; }
  :root:not([data-exp="classic"]) #qcard { padding: 28px 32px; }
  :root:not([data-exp="classic"]) .question { font-size: 1.32rem; }
  :root:not([data-exp="classic"]) .wchoice { min-height: 74px; }
  :root[data-exp="explore"] .mission.explore { padding: 28px; }
  :root[data-exp="explore"] .mission.explore .mission-title { font-size: 2.3rem; }
  .hero-pet { font-size: 4.6rem; right: 22px; top: 14px; }
  :root[data-exp="achieve"] .goal-title { font-size: 2.1rem; }
  .klar { padding: 36px 32px; }
}
@media (min-width: 1100px) and (orientation: landscape) {
  :root:not([data-exp="classic"]) .wrap { max-width: 1060px; }
  :root:not([data-exp="classic"]) .home-v3 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  :root:not([data-exp="classic"]) .home-v3 > :first-child { grid-row: 1 / span 8; }
  #qcard.split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); column-gap: 36px; align-items: start; }
  #qcard.split > .q-pane { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  #qcard.split #actions { position: static; background: none; }
}
