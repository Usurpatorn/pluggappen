name: CI – test, bygg, publicera
# Varje push till main: hela testsviten → reproducerbart bygge → kontroll att den publicerade index.html är byggd från källorna →
# (när Pages är inställt på "GitHub Actions", repo-variabel PAGES_ACTIONS=true) publicering + release-tagg.
# Rollback: Actions → "CI – test, bygg, publicera" → Run workflow → ange en release-tagg eller commit i `deploy_ref`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: 'Commit/tagg att bygga och publicera (rollback). Tomt = main.'
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Testa och bygg
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.deploy_ref || github.ref }}
          fetch-depth: 0   # hela historiken – integritetskontrollen granskar varje commit
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bygg
        id: build
        run: |
          npm run build | tee build.log
          echo "build_id=$(grep -o 'v[0-9.]* ([0-9a-f]*)' build.log | head -1)" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Reproducerbarhet – bygg igen och jämför byte för byte
        run: |
          cp dist/index.html /tmp/first.html
          npm run build >/dev/null
          cmp /tmp/first.html dist/index.html && echo "Bygget är reproducerbart"
      - name: Testsvit (måste vara helt grön)
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: npm test
      - name: Integritet i git-historiken (varje commit och meddelande; termerna skrivs aldrig ut)
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: |
          git fetch -q origin main || true
          node scripts/privacy-history.mjs
      - name: Publicerad index.html måste vara byggd från källorna
        if: ${{ vars.PAGES_ACTIONS != 'true' }}
        run: |
          if [ -f index.html ]; then cmp index.html dist/index.html && echo "index.html i repots rot = bygget"; else echo "ingen index.html i roten (Pages via Actions)"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ steps.build.outputs.build_id }}
          path: dist/
          retention-days: 90

  rules:
    # Firestore-reglerna mot Googles regelmotor (Firestore-emulatorn). Publicerar INGENTING – reglerna läggs ut manuellt (RELEASING.md).
    # Samma fall körs mot reglerna i 2.0.0 och 2.1.0 med deras kända hål förväntade, så att körningen visar vad varje ändring stänger.
    name: Firestore-regler i emulatorn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verktyg (bara i detta jobb)
        run: npm install --no-save --no-audit --no-fund firebase-tools@13.29.1 @firebase/rules-unit-testing@3.0.4 firebase@10.14.1
      - name: Gamla regelfiler för jämförelse
        run: |
          git show 6ca2933a6d6d19ec7ea005f87b383a874fb88d26:firestore.rules > /tmp/rules.v20
          git show f91366f036d9a1bdf45340cd97d285a492ee8588:firestore.rules > /tmp/rules.v21
      - name: Nuvarande regler (måste hålla)
        run: npx firebase emulators:exec --project demo-pluggappen --only firestore "node tests/rules/rules.test.mjs"
      - name: Nyckelfri publicering (backup, konfliktskydd, återläsning, rollback)
        run: npx firebase emulators:exec --project demo-pluggappen --only firestore "node tests/rules/publish.test.mjs"
      - name: Synkens villkorade skrivning (3.2.2) – Firestore förstår villkoren och nekar en inaktuell version
        run: npx firebase emulators:exec --project demo-pluggappen --only firestore "node tests/rules/sync_precondition.test.mjs"
      - name: Regler 2.0.0 (kända hål förväntas)
        run: npx firebase emulators:exec --project demo-pluggappen --only firestore "node tests/rules/rules.test.mjs"
        env:
          RULES_FILE: /tmp/rules.v20
          EXPECT: v20
      - name: Regler 2.1.0 (känt läshål förväntas)
        run: npx firebase emulators:exec --project demo-pluggappen --only firestore "node tests/rules/rules.test.mjs"
        env:
          RULES_FILE: /tmp/rules.v21
          EXPECT: v21

  browser:
    # Det jsdom inte kan mäta: layout och tillgänglighet i riktig Chromium (Svara/Nästa nåbara, ingen sidledsscroll, återkopplingen
    # täcks inte, föräldraflikarna syns, axe-core WCAG 2.1 A/AA, Testa mig lämnar inte in på ett tryck). Syntetisk familj. Publicerar inget.
    name: Layout och tillgänglighet i Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verktyg (bara i detta jobb)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: Layout och tillgänglighet (375×667, 390×844, 820×1180, 1180×820)
        run: node tests/browser/layout.js
  deploy:
    name: Publicera (GitHub Pages)
    needs: [test, browser]
    if: ${{ vars.PAGES_ACTIONS == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ needs.test.outputs.build_id }}
          path: dist
      # Testadress för en förhandsversion (t.ex. Experience v3 före merge): bara när repo-variabeln PREVIEW_REF är satt till en gren.
      # Byggs från grenen med PREVIEW=1 → <sajten>/preview/. Inget familjeinnehåll byggs in; egen lagring, ingen service worker,
      # ingen push (se scripts/build.sh på grenen). Misslyckas förhandsbygget publiceras produktionen ändå – utan testadress.
      # Ta bort testadressen: radera variabeln och kör workflowen igen.
      - uses: actions/setup-node@v5
        if: ${{ vars.PREVIEW_REF != '' }}
        with:
          node-version: '22'
      - name: Bygg testadressen (förhandsversion)
        id: preview
        if: ${{ vars.PREVIEW_REF != '' }}
        continue-on-error: true
        env:
          PREVIEW_REF: ${{ vars.PREVIEW_REF }}
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: |
          git clone --quiet --depth 1 --branch "$PREVIEW_REF" "https://github.com/$GITHUB_REPOSITORY.git" preview-src
          cd preview-src
          npm ci --no-audit --no-fund
          npm run build
          node tests/test_preview.js
          # Testadressen är förälderns testmiljö: bara en gren med "Testa som barnet" och dess skydd publiceras (annars skulle den
          # skriva riktiga bevis i barnens profiler). Testet raderar dist/preview när det är klart – därför före förhandsbygget.
          test -f tests/test_parent_test_mode.js || { echo "::error::Grenen saknar Testa som barnet – testadressen publiceras inte"; exit 1; }
          node tests/test_parent_test_mode.js
          PREVIEW=1 bash scripts/build.sh
          node tests/test_privacy.js
          test -f dist/preview/index.html
          for m in "__tmBegin" "__PV_TM" "testversionen skriver inte barnens data"; do grep -q "$m" dist/preview/index.html || { echo "::error::Testsidan saknar skyddet ($m) – publiceras inte"; exit 1; }; done
      - name: Lägg testadressen bredvid produktionen
        if: ${{ steps.preview.outcome == 'success' }}
        env:
          PREVIEW_REF: ${{ vars.PREVIEW_REF }}
        run: |
          mkdir -p dist/preview && cp preview-src/dist/preview/index.html dist/preview/index.html
          echo "### Testadress: <sajten>/preview/ (gren: $PREVIEW_REF)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Release-tagg
    needs: [test, browser]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ needs.test.outputs.build_id }}
          path: dist
      - name: Tagga och skapa release (en per publicerat bygge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="release-${{ needs.test.outputs.version }}-$(git rev-parse --short=7 HEAD)"
          if git rev-parse "$TAG" >/dev/null 2>&1; then echo "taggen finns redan"; exit 0; fi
          git tag "$TAG" && git push origin "$TAG"
          gh release create "$TAG" dist/index.html --title "${{ needs.test.outputs.build_id }}" --notes "Automatisk release från CI. Rollback: Run workflow med deploy_ref=$TAG."
